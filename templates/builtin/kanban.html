  // ---------- page links ----------
  // [[scribe:key]] (or a bare page id) shows the page's title, [[target|label]] your own text, [[peek:target]] /
  // [[split:target]] pick a mode, and [label](scribe:key) / (peek:…) / (split:…) is the markdown form. A key or id
  // written on its own (scribe:some-key, t_1a2b3c4d) links too. Scribe resolves titles and strikes out missing pages.
  var LINK_MODES = { tab: "tab", peek: "peek", split: "split" };
  var PAGE_LINK_RES = [
    /\[\[\s*(?:(tab|peek|split):)?([^\]|]+?)\s*(?:\|([^\]]*))?\]\]/g,
    /\[([^\]]+)\]\((?:(tab|peek|split):([^)\s]+)|(scribe:[^)\s]+))\)/g,
    /(^|[^\w\/#:-])(scribe:[a-z0-9._-]*[a-z0-9_-]|t_[0-9a-f]{8})(?![\w-])/g
  ];
  function pageLinkHtml(target, label, mode) {
    return '<a href="#" class="page-link" data-scribe-open="' + escapeHtml(target) + '"' +
      (mode ? ' data-scribe-mode="' + mode + '"' : "") + ">" + escapeHtml(label) + "</a>";
  }
  /** Replace page links in raw text with held anchors; `hold` returns a placeholder the caller swaps back. */
  function holdPageLinks(s, hold) {
    s = s.replace(PAGE_LINK_RES[0], function (_, mode, target, label) {
      return hold(pageLinkHtml(target, String(label || "").trim(), mode ? LINK_MODES[mode] : ""));
    });
    s = s.replace(PAGE_LINK_RES[1], function (_, label, mode, target, key) {
      return hold(pageLinkHtml(target || key, label, mode ? LINK_MODES[mode] : ""));
    });
    return s.replace(PAGE_LINK_RES[2], function (_, pre, target) {
      return pre + hold(pageLinkHtml(target, "", ""));
    });
  }
  /** Plain text (a title, a comment) as HTML with only its page links live. */
  function linkText(raw) {
    var held = [];
    var s = holdPageLinks(String(raw == null ? "" : raw), function (html) {
      held.push(html);
      return "\u0000" + (held.length - 1) + "\u0000";
    });
    return escapeHtml(s).replace(/\u0000(\d+)\u0000/g, function (_, i) { return held[Number(i)]; });
  }
  /** Page links reduced to their label or target, for places that only take text. */
  function plainLinks(raw) {
    return String(raw == null ? "" : raw)
      .replace(PAGE_LINK_RES[0], function (_, mode, target, label) { return String(label || "").trim() || target; })
      .replace(PAGE_LINK_RES[1], "$1")
      .replace(PAGE_LINK_RES[2], "$1$2");
  }

  // ---------- markdown ----------
  function resolveImg(url, images) {
    url = str(url).trim();
    var hash = /^#img-(.+)$/.exec(url);
    if (hash) {
      for (var i = 0; i < images.length; i++) if (images[i].id === hash[1]) return images[i].data;
      return "";
    }
    if (/^\/blob\/pa_[0-9a-f]{24}$/.test(url) || /^https?:\/\//i.test(url)) return url;
    if (/^data:image\/(png|jpeg|gif|webp);/i.test(url)) return url;
    return "";
  }
  function inline(raw, images) {
    var held = [];
    function hold(html) { held.push(html); return "\u0000" + (held.length - 1) + "\u0000"; }
    var s = raw.replace(/`([^`]+)`/g, function (_, code) { return hold("<code>" + escapeHtml(code) + "</code>"); });
    s = holdPageLinks(s, hold);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, url) {
      var src = resolveImg(url, images);
      return src ? hold('<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '">') : "";
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, url) {
      if (!/^https?:\/\//i.test(url)) return text;
      return hold('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(text) + "</a>");
    });
    s = escapeHtml(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(/(^|[\s(])#(\d+)\b/g, function (m, pre, n) {
      var target = byNum(Number(n));
      return target ? pre + '<a href="#" data-card="' + target.id + '">#' + n + "</a>" : m;
    });
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return held[Number(i)]; });
  }
  function renderMarkdown(src, images) {
    var lines = str(src).replace(/\r\n?/g, "\n").split("\n");
    var html = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^```/.test(line)) {
        var code = [];
        for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
        html.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
        continue;
      }
      var h = /^(#{1,3})\s+(.*)$/.exec(line);
      if (h) { html.push("<h" + h[1].length + ">" + inline(h[2], images) + "</h" + h[1].length + ">"); continue; }
      if (/^>\s?/.test(line)) {
        var q = [];
        for (; i < lines.length && /^>\s?/.test(lines[i]); i++) q.push(inline(lines[i].replace(/^>\s?/, ""), images));
        i--;
        html.push("<blockquote>" + q.join("<br>") + "</blockquote>");
        continue;
      }
      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        var ordered = /^\s*\d+\./.test(line);
        var items = [];
        for (; i < lines.length && (ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/).test(lines[i]); i++) {
          items.push("<li>" + inline(lines[i].replace(ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/, ""), images) + "</li>");
        }
        i--;
        html.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
        continue;
      }
      if (!line.trim()) continue;
      var para = [];
      for (; i < lines.length && lines[i].trim() && !/^(```|#{1,3}\s|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i]); i++) para.push(inline(lines[i], images));
      i--;
      html.push("<p>" + para.join("<br>") + "</p>");
    }
    return html.join("");
  }
  mdPreview.addEventListener("click", function (e) {

  // ---------- settings ----------

  // ---------- agent workers ----------
  // An agent column can have a worker: while it runs (settings.workers[columnId].run), the board
  // starts a fresh agent chat for each card, so a long run doesn't carry one ever-growing context.
  // The agent may take a closely related card in the same chat, and ends its turn otherwise. When
  // a chat ends, the board merges its worktree branch (if it has one), so the next agent starts
  // from the latest work, then starts the next card or waits for one. Every open window runs this
  // code: the worker_step action lets one of them take each step. Anything unexpected (a failed
  // turn, an unfinished card, a merge that doesn't go through) pauses the worker with its reason.
  // "Stop when its card is done" sets stop on the worker (list shows it as stopRequested on the
  // column) and logs worker_stop. When a plan usage limit stops the agent's turn, the worker keeps
  // its chat and card (wait.until) and sends it on once the limit has reset.
  var FOLDER_MODES = { code: true, plan: true };
  /** Cards one agent chat may take before the board starts a fresh one. */
  var MAX_CARDS_PER_AGENT = 3;
  /** Matches the worker_step action's lease. */
  var STEP_LEASE_MS = 15 * 60 * 1000;
  /** How long after a plan limit resets the worker sends its agent on, so the new usage is in. */
  var RESUME_DELAY_MS = 60 * 1000;
  /** Limit waits in a row before the worker gives up on a card and pauses. */
  var MAX_LIMIT_WAITS = 8;
  var RESUME_PROMPT = "Your plan's usage limit has reset. Go on with your card where you left off: check the card and the work you have done so far, then finish it as before.";
  var MODE_LABELS = { code: "Code", plan: "Plan", ask: "Ask", board: "Pages" };
  var PLAY_SVG = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1.2v7.6L8.6 5z"/></svg>';
  var agentOptions = null;
  /** Thread id -> { status, queued } as Scribe last reported it. */
  var threadStatus = {};
  var launching = {};
  var advancing = {};
  var soloStarting = {};
  var soloMerging = {};
  var workerErrors = {};
  var workersTimer = 0;
  var waitTimer = 0;
  var workerCol = null;
  var workerHintOpen = false;
  var stopCol = null;

  function hasWorkerApi() {
    return Boolean(scribe.agent && typeof scribe.agent.options === "function");
  }
  function workers() {
    var w = settings().workers;
    return w && typeof w === "object" ? w : {};
  }
  function worker(colId) {
    var w = workers()[colId];
    return w && typeof w === "object" ? w : null;
  }
  function workerMode(w) { return str(w && w.mode) || "code"; }
  function modelParamsOf(opts, provider, modelId) {
    var models = (opts && opts.models && opts.models[provider]) || [];
    var model = models.filter(function (m) { return m.id === modelId; })[0];
    if (!model) model = models.filter(function (m) { return m.id === str(opts && opts.defaults && opts.defaults.model); })[0] || models[0];
    return (model && model.params) || [];
  }
  function fastParamOf(opts, provider, modelId) {
    return modelParamsOf(opts, provider, modelId).filter(function (p) { return p.id === "fast"; })[0] || null;
  }
  function workerReady(w) {
    return Boolean(w && str(w.instructions).trim() && (!FOLDER_MODES[workerMode(w)] || str(w.cwd).trim()));
  }
  function workerRunning(w) {
    var t = w && w.threadId ? threadStatus[w.threadId] : null;
    return Boolean(t && (t.status !== "idle" || t.queued > 0));
  }
  /** Started and not stopped: working on a card, or waiting for one. */
  function workerOn(w) { return Boolean(w && w.run); }
  /** Out of plan usage: when the worker sends its agent on, else 0. */
  function workerWaitUntil(w) { return (w && w.wait && Number(w.wait.until)) || 0; }
  function limitTime(at) {
    return new Date(at).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
  }
  function saveWorker(colId, patch) {
    var all = Object.assign({}, workers());
    var next = Object.assign({}, all[colId] || {}, patch);
    Object.keys(next).forEach(function (k) { if (next[k] == null || next[k] === "" || next[k] === false) delete next[k]; });
    all[colId] = next;
    scribe.set({ settings: Object.assign({}, settings(), { workers: all }) });
  }
  /**
   * Change a worker's run fields on the latest state (null removes one), whatever this window has
   * seen: worker_step and other windows write them too.
   */
  function patchWorker(colId, patch) {
    if (!worker(colId)) return;
    scribe.update([{ op: "merge", path: "settings/workers/" + colId, value: patch }]);
  }
  function removeWorker(colId) {
    var all = Object.assign({}, workers());
    delete all[colId];
    var next = Object.assign({}, settings());
    if (Object.keys(all).length) next.workers = all; else delete next.workers;
    scribe.set({ settings: next });
  }
  function workerSummary(w) {
    if (!w) return "Not set up";
    var mode = workerMode(w);
    var parts = [str(w.name) || "Agent", MODE_LABELS[mode] || mode];
    if (w.fast === "true") parts.push("fast");
    if (w.web === "limited") parts.push("web limited");
    else if (w.web === "off") parts.push("no web");
    if (FOLDER_MODES[mode] && w.cwd) parts.push(str(w.cwd).split(/[\\/]/).filter(Boolean).pop() || w.cwd);
    if (!workerReady(w)) parts.push(FOLDER_MODES[mode] && !w.cwd ? "needs a folder" : "needs instructions");
    else if (workerRunning(w)) parts.push(w.stop ? "stopping" : "working");
    else if (workerWaitUntil(w)) parts.push("out of usage until " + limitTime(workerWaitUntil(w)));
    else if (workerOn(w)) parts.push("waiting for cards");
    return parts.join(" · ");
  }

  /** Ask Scribe how each worker's last thread is doing, once per thread; onChange keeps it current. */
  function refreshWorkerThreads() {
    if (!hasWorkerApi()) return;
    Object.keys(workers()).forEach(function (colId) {
      var w = worker(colId);
      [w.threadId].concat(Object.keys(soloRuns(w))).forEach(function (id) {
        if (!id || threadStatus[id]) return;
        threadStatus[id] = { status: "idle", queued: 0, unknown: true };
        scribe.agent.get(id).then(function (r) {
          if (r && r.ok && r.thread) threadStatus[id] = { status: r.thread.status, queued: r.thread.queued || 0 };
          else if (r && r.error === "not_found") threadStatus[id] = { status: "idle", queued: 0 };
          render();
        });
      });
    });
  }
  if (scribe.agent && scribe.agent.onChange) {
    scribe.agent.onChange(function (t) {
      threadStatus[t.id] = { status: t.status, queued: t.queued || 0 };
      render();
    });
  }

  function boardTitle() {
    var h = document.querySelector("h1");
    return h ? h.textContent.trim() : "Board";
  }
  function workerPrompt(col, w, c, fallbackInstructions, solo) {
    var name = str(w.name).trim();
    var colRef = JSON.stringify(col.id);
    var lines = [
      "You are an agent worker for the \"" + col.title + "\" column of the Kanban board \"" + boardTitle() + "\" (Scribe page id " + scribe.id + ").",
      "",
      "The user's instructions:",
      str(w.instructions).trim() || fallbackInstructions || "",
      "",
      "Your card: #" + c.num + " " + c.title,
      "",
      "How to work:",
      "- Use the board with the scribe MCP: page_action with id \"" + scribe.id + "\". The board's agent guide comes with this message (or with your first page_action result); follow it.",
      "- get the card, claim it" + (name ? " with assignee \"" + name + "\"" : "") + ", do the work, then finish it. If you need the user's input, release it with status { kind: \"blocked\", text } and a note saying what you need, instead of waiting for an answer.",
    ];
    if (FOLDER_MODES[workerMode(w)] && w.worktree) {
      lines.push("- You work in a git worktree, on a branch of your own. Commit your work. Before you end your turn, rebase onto the branch the worktree was made from (the one checked out in the main checkout; see git worktree list) and resolve any conflicts, so it merges cleanly. When your turn ends, the board merges your branch, and the next agent starts from there.");
    }
    if (solo) {
      lines.push("- This is a one-off run for this card only. Don't take other cards; when it is finished, end your turn.");
    } else if (w.context === "fresh") {
      lines.push("- Work on this card only, then end your turn. The board starts a fresh agent for the next card.");
    } else {
      lines.push("- When it is finished, list the column (list { column: " + colRef + " }). If the column shows stopRequested: true, end your turn. If one of its cards that isn't claimed or blocked is closely related to the work you just did, so that what you know now saves real effort, take it next in this turn the same way, up to " + MAX_CARDS_PER_AGENT + " cards in all. Otherwise end your turn: the board starts a fresh agent with a clean context for the next card, which costs less than carrying this conversation along.");
    }
    lines.push("- Don't wait for new cards; the board does that. End your turn with a short summary.");
    return lines.join("\n");
  }
  function launchError(r) {
    var error = r && r.error;
    if (error === "denied") return "Scribe didn't allow it. Change it from the tab menu → Permissions…";
    if (error === "no_board") return "Open this board in Scribe to launch agents.";
    if (error === "no_gesture") return "Click the button to launch the agent.";
    if (error === "timeout") return "Scribe didn't answer in time.";
    if (/^(unknown_|needs_folder|no_provider)/.test(str(error))) return "Check the worker's setup (" + error + ").";
    return error ? "Could not launch: " + error : "Could not launch the agent.";
  }
  /** The column's next card for a worker: top first, skipping held ones, blocked ones the user hasn't answered, and ones waiting on unfinished cards. */
  function nextCard(colId) {
    return cardsIn(colId).filter(function (c) {
      if ((c.claim && !c.claim.stale) || soloStarting[c.id]) return false;
      if (c.status && c.status.kind === "blocked") {
        var last = c.comments[c.comments.length - 1];
        if (!last || last.by !== "user") return false;
      }
      return !c.blockedBy.some(function (id) {
        var b = card(id);
        var bCol = b && colOf(b);
        return b && !b.archived && !(bCol && (bCol.role === "done" || bCol.role === "review"));
      });
    })[0] || null;
  }

  function scheduleWorkers() {
    clearTimeout(workersTimer);
    workersTimer = setTimeout(advanceWorkers, 400);
  }
  /** Move on any running worker whose agent is done, or that waits and has a card to take. */
  function advanceWorkers() {
    if (!AGENT_MODE || !hasWorkerApi()) return;
    clearTimeout(waitTimer);
    var soonest = 0;
    Object.keys(workers()).forEach(wrapUpSolos);
    Object.keys(workers()).forEach(function (colId) {
      var col = column(colId), w = worker(colId);
      if (!col || col.role !== "agent" || !workerOn(w) || advancing[colId] || launching[colId]) return;
      if (w.step && Number(w.step.at) > Date.now() - STEP_LEASE_MS) return;
      var due = workerWaitUntil(w) ? workerWaitUntil(w) + RESUME_DELAY_MS : 0;
      if (due > Date.now()) {
        if (!soonest || due < soonest) soonest = due;
        return;
      }
      if (w.threadId) {
        var t = threadStatus[w.threadId];
        if (!t || t.unknown || t.status !== "idle" || t.queued > 0) return;
      } else if (!w.stop && !nextCard(colId)) {
        return;
      }
      stepWorker(colId, false);
    });
    // Come back when a limit wait is over; at most an hour at a time, so a sleeping machine catches up.
    if (soonest) waitTimer = setTimeout(scheduleWorkers, Math.min(Math.max(soonest - Date.now(), 1000), 60 * 60 * 1000));
  }

  /** One step, held through worker_step: wrap up the last agent (check, merge), then start the next card, wait, or stop. */
  function stepWorker(colId, start) {
    var w = worker(colId);
    var from = str(w && w.threadId) || null;
    // A click goes on from a pause; it only wraps up a chat whose merge didn't go through.
    var wrap = Boolean(from && (!start || w.merge === from));
    var resume = Boolean(from && !start && workerWaitUntil(w));
    advancing[colId] = true;
    var since = start ? Date.now() : Number(w.run.since) || Date.now();
    return scribe.action("worker_step", { column: colId, from: from, token: newId("st"), start: Boolean(start) }).then(
      function (r) {
        if (resume) return resumeAgent(colId, from);
        return (wrap ? wrapUp(colId, from, start ? null : r) : Promise.resolve(true)).then(function (ok) {
          if (ok) return nextStep(colId, since, start);
        });
      },
      function (err) {
        // Another window took the step, or the agent isn't done after all. A click says why.
        if (start) workerErrors[colId] = "Could not start: " + str(err && err.message);
      }
    ).then(function () {
      delete advancing[colId];
      delete launching[colId];
      render();
    });
  }

  /**
   * The last agent's chat ended: pause on a failed turn or a card it didn't finish (r is null on
   * a click, which goes on from such a pause), else merge its worktree. Resolves whether to go on.
   */
  function wrapUp(colId, threadId, r) {
    var w = worker(colId), run = w.run || {};
    if (r) {
      var turn = r.lastTurn;
      if (turn && turn.status === "error" && turn.limitResetsAt) {
        var waits = (Number(w.wait && w.wait.count) || 0) + 1;
        if (waits > MAX_LIMIT_WAITS) {
          endRun(colId, "The agent kept running out of plan usage (" + MAX_LIMIT_WAITS + " waits in a row). Its chat is kept; press ▶ to go on with the next card.", true);
        } else {
          patchWorker(colId, { step: null, wait: { until: Number(turn.limitResetsAt), count: waits } });
        }
        return Promise.resolve(false);
      }
      if (turn && (turn.status === "error" || turn.status === "cancelled")) {
        endRun(colId, "The agent's turn " + (turn.status === "error" ? "failed" + (turn.error ? ": " + turn.error : "") : "was stopped") + ". Its chat is kept; press ▶ to go on with the next card.", true);
        return Promise.resolve(false);

      if (held.length) {

      if (m && (m.ok || m.error === "not_found")) return true;
      var why = m && m.error === "merge_failed" ? m.message : launchError(m);
      endRun(colId, "Could not merge the agent's branch: " + why + " Sort it out from its chat's branch menu, or press ▶ to try again.", false);
      return false;
    });
  }

  /** A plan limit stopped the agent and has reset since: send its chat on, keeping its card. */
  function resumeAgent(colId, threadId) {
    var w = worker(colId);

  }

  /** start: the step began with a click, which already cleared stop in the daemon (this window may not have that yet). */

    if (w.stop && !start) { endRun(colId, null, true); return; }
    var c = nextCard(colId);
    if (!c) {
      patchWorker(colId, { threadId: null, step: null, merge: null, wait: null, run: { since: since } });
      return;
    }
    return startCard(colId, c, since);
  }

  function startCard(colId, c, since) {
    var col = column(colId), w = worker(colId);
    var mode = workerMode(w);
    var opts = { title: ((str(w.name) || "Agent") + " · #" + c.num + " " + c.title).slice(0, 120), mode: mode };
    ["provider", "model", "effort", "show", "web"].forEach(function (k) { if (str(w[k])) opts[k] = w[k]; });
    if (w.fast === "true") opts.fast = true;
    else if (w.fast === "false") opts.fast = false;

  // ---------- one-card runs ----------
  // Started from a card's menu with the column worker's settings, beside its own run: the worker
  // doesn't wait on them, and they don't take other cards. settings.workers[col].solo keeps the
  // ones still going ({ [threadId]: { card, at } }) so any window can merge them once they end.
  function soloRuns(w) {
    return w && w.solo && typeof w.solo === "object" ? w.solo : {};
  }
  function canRunSolo(c) {
    var col = colOf(c), w = col && worker(col.id);
    return Boolean(AGENT_MODE && hasWorkerApi() && col && col.role === "agent" && workerReady(w) && !c.archived && !(c.claim && !c.claim.stale) && !soloStarting[c.id]);
  }
  function runSolo(id) {
    var c = card(id);
    if (!c || !canRunSolo(c)) return;

    glide.pos = Math.abs(boardEl.scrollLeft - glide.pos) <= 1 ? glide.pos : boardEl.scrollLeft;
    requestAnimationFrame(stepGlide);
  }
  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === "Escape") {
      if (!lightbox.classList.contains("hidden")) { lightbox.classList.add("hidden"); return; }
      if (menuEl) { closeMenu(); return; }
      if (openId && !typing) { closeCard(); return; }
      if (!archiveEl.classList.contains("hidden") && !typing) { archiveEl.classList.add("hidden"); archiveBtn.classList.remove("on"); }
      return;
    }
    if (e.key === "/" && !typing && !openId) {
      e.preventDefault();
      searchEl.focus();
    }
  });

  scribe.onChange(function () {
    ensureShape();
    render();
  });
  ensureShape();
  render();
})();
</script>
</body>
</html>
