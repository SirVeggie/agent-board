  /** In-page replacement for window.confirm. Resolves true on confirm; Esc, Cancel or the backdrop resolve false. */
  function askConfirm(opts) {
    if (confirmDone) confirmDone(false);
    closeMenu();
    $("confirmTitle").textContent = opts.title;
    $("confirmText").textContent = opts.text || "";
    $("confirmOk").textContent = opts.ok || "Delete";
    var returnFocus = document.activeElement;
    confirmBack.classList.remove("hidden");
    $("confirmOk").focus();
    return new Promise(function (resolve) {
      confirmDone = function (ok) {
        confirmDone = null;
        confirmBack.classList.add("hidden");
        if (returnFocus && returnFocus.isConnected && returnFocus.focus) returnFocus.focus();
        resolve(ok);
      };
    });
  }
  $("confirmOk").addEventListener("click", function () { if (confirmDone) confirmDone(true); });
  $("confirmCancel").addEventListener("click", function () { if (confirmDone) confirmDone(false); });
  confirmBack.addEventListener("pointerdown", function (e) {
    if (e.target === confirmBack && confirmDone) confirmDone(false);
  });
  // Capture phase, ahead of the page's own shortcuts, so Esc here doesn't also close the card.
  window.addEventListener("keydown", function (e) {
    if (!confirmDone) return;
    if (e.key === "Escape") {
      e.preventDefault();
      e.stopImmediatePropagation();
      confirmDone(false);
    } else if (e.key === "Tab") {
      e.preventDefault();
      (document.activeElement === $("confirmOk") ? $("confirmCancel") : $("confirmOk")).focus();
    }
  }, true);

  // ---------- page links ----------
  // [[key or id]] shows the page's title, [[target|label]] your own text, [[peek:target]] / [[split:target]] pick a
  // mode, and [label](board:target) / (peek:…) / (split:…) is the markdown form. A reference pasted from Copy key
  // ("Agent Board tab some-key") or a bare page id (t_1a2b3c4d) links too. The board resolves titles and strikes out missing pages.
  var LINK_MODES = { board: "", tab: "tab", peek: "peek", split: "split" };
  var PAGE_LINK_RES = [
    /\[\[\s*(?:(board|tab|peek|split):)?([^\]|]+?)\s*(?:\|([^\]]*))?\]\]/g,
    /\[([^\]]+)\]\((board|tab|peek|split):([^)\s]+)\)/g,
    /(^|[^\w\/#-])(?:Agent Board tab ([a-z0-9._:-]*[a-z0-9_-])|(t_[0-9a-f]{8}))(?![\w-])/g
  ];
  function pageLinkHtml(target, label, mode) {
    return '<a href="#" class="page-link" data-board-open="' + escapeHtml(target) + '"' +
      (mode ? ' data-board-mode="' + mode + '"' : "") + ">" + escapeHtml(label) + "</a>";
  }
  /** Replace page links in raw text with held anchors; `hold` returns a placeholder the caller swaps back. */
  function holdPageLinks(s, hold) {
    s = s.replace(PAGE_LINK_RES[0], function (_, mode, target, label) {
      return hold(pageLinkHtml(target, String(label || "").trim(), LINK_MODES[mode || "board"]));
    });
    s = s.replace(PAGE_LINK_RES[1], function (_, label, mode, target) {
      return hold(pageLinkHtml(target, label, LINK_MODES[mode]));
    });
    return s.replace(PAGE_LINK_RES[2], function (_, pre, key, id) {
      return pre + hold(pageLinkHtml(key || id, "", ""));
    });
  }
  /** Plain text (a title, a comment) as HTML with only its page links live. */
  function linkText(raw) {
    var held = [];
    var s = holdPageLinks(String(raw == null ? "" : raw), function (html) {
      held.push(html);
      return "\u0000" + (held.length - 1) + "\u0000";
    });
    return escapeHtml(s).replace(/\u0000(\d+)\u0000/g, function (_, i) { return held[Number(i)]; });
  }
  /** Page links reduced to their label or target, for places that only take text. */
  function plainLinks(raw) {
    return String(raw == null ? "" : raw)
      .replace(PAGE_LINK_RES[0], function (_, mode, target, label) { return String(label || "").trim() || target; })
      .replace(PAGE_LINK_RES[1], "$1")
      .replace(PAGE_LINK_RES[2], "$1$2$3");
  }

  // ---------- markdown ----------
  function resolveImg(url, images) {
    url = str(url).trim();
    var hash = /^#img-(.+)$/.exec(url);
    if (hash) {
      for (var i = 0; i < images.length; i++) if (images[i].id === hash[1]) return images[i].data;
      return "";
    }
    if (/^\/blob\/pa_[0-9a-f]{24}$/.test(url) || /^https?:\/\//i.test(url)) return url;
    if (/^data:image\/(png|jpeg|gif|webp);/i.test(url)) return url;
    return "";
  }
  function inline(raw, images) {
    var held = [];
    function hold(html) { held.push(html); return "\u0000" + (held.length - 1) + "\u0000"; }
    var s = raw.replace(/`([^`]+)`/g, function (_, code) { return hold("<code>" + escapeHtml(code) + "</code>"); });
    s = holdPageLinks(s, hold);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, url) {
      var src = resolveImg(url, images);
      return src ? hold('<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '">') : "";
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, url) {
      if (!/^https?:\/\//i.test(url)) return text;
      return hold('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(text) + "</a>");
    });
    s = escapeHtml(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(/(^|[\s(])#(\d+)\b/g, function (m, pre, n) {
      var target = byNum(Number(n));
      return target ? pre + '<a href="#" data-card="' + target.id + '">#' + n + "</a>" : m;
    });
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return held[Number(i)]; });
  }
  function renderMarkdown(src, images) {
    var lines = str(src).replace(/\r\n?/g, "\n").split("\n");
    var html = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^```/.test(line)) {
        var code = [];
        for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
        html.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
        continue;
      }
      var h = /^(#{1,3})\s+(.*)$/.exec(line);
      if (h) { html.push("<h" + h[1].length + ">" + inline(h[2], images) + "</h" + h[1].length + ">"); continue; }
      if (/^>\s?/.test(line)) {
        var q = [];
        for (; i < lines.length && /^>\s?/.test(lines[i]); i++) q.push(inline(lines[i].replace(/^>\s?/, ""), images));
        i--;
        html.push("<blockquote>" + q.join("<br>") + "</blockquote>");
        continue;
      }
      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        var ordered = /^\s*\d+\./.test(line);
        var items = [];
        for (; i < lines.length && (ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/).test(lines[i]); i++) {
          items.push("<li>" + inline(lines[i].replace(ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/, ""), images) + "</li>");
        }
        i--;
        html.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
        continue;
      }
      if (!line.trim()) continue;
      var para = [];
      for (; i < lines.length && lines[i].trim() && !/^(```|#{1,3}\s|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i]); i++) para.push(inline(lines[i], images));
      i--;
      html.push("<p>" + para.join("<br>") + "</p>");
    }
    return html.join("");
  }
  mdPreview.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[data-card]");
    if (a) { e.preventDefault(); e.stopPropagation(); openCard(a.getAttribute("data-card")); }
  }, true);
  commentsEl.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[data-card]");
    if (a) { e.preventDefault(); openCard(a.getAttribute("data-card")); return; }
    if (e.target.tagName === "IMG") showLightbox(e.target.src);
  });

  // ---------- labels popover ----------
  labelsBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    openLabelsMenu();
  });
  function openLabelsMenu() {
    openMenu(labelsBtn, function (menu) {
      menu.style.width = "300px";
      menu.appendChild(el("div", "label", "Labels"));
      labels().forEach(function (l) {
        var row = el("div", "menu-row label-edit");
        var sw = el("button", "swatch");
        sw.type = "button";
        sw.style.background = l.color;
        sw.title = "Change colour";
        sw.addEventListener("click", function (ev) {
          ev.stopPropagation();
          var i = PALETTE.indexOf(l.color);
          saveLabels(labels().map(function (x) { return x.id === l.id ? Object.assign({}, x, { color: PALETTE[(i + 1) % PALETTE.length] }) : x; }));
          openLabelsMenu();
        });
        var name = el("input", "field");
        name.value = l.name;
        name.addEventListener("click", function (ev) { ev.stopPropagation(); });
        name.addEventListener("change", function () {
          var v = name.value.trim();
          if (v) saveLabels(labels().map(function (x) { return x.id === l.id ? Object.assign({}, x, { name: v }) : x; }));
        });
        var used = liveCards().filter(function (c) { return c.labels.indexOf(l.id) !== -1; }).length;
        var rm = el("button", "ghost", "×");
        rm.type = "button";
        rm.title = used ? "Delete (removes it from " + used + " card" + (used === 1 ? "" : "s") + ")" : "Delete";
        rm.addEventListener("click", function (ev) {
          ev.stopPropagation();
          saveLabels(labels().filter(function (x) { return x.id !== l.id; }));
          setCards(allCards().map(function (c) {
            return c.labels.indexOf(l.id) === -1 ? c : Object.assign({}, c, { labels: c.labels.filter(function (y) { return y !== l.id; }) });
          }));
          openLabelsMenu();
        });
        row.appendChild(sw);
        row.appendChild(name);
        row.appendChild(rm);
        menu.appendChild(row);
      });
      var addRow = el("div", "menu-row label-edit");
      var input = el("input", "field");
      input.placeholder = "New label, Enter to add";
      input.addEventListener("click", function (ev) { ev.stopPropagation(); });
      input.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" || !input.value.trim()) return;
        var color = PALETTE[labels().length % PALETTE.length];
        saveLabels(labels().concat([{ id: newId("lb"), name: input.value.trim(), color: color }]));
        openLabelsMenu();
        var fresh = menuEl && menuEl.querySelector("input[placeholder^='New label']");
        if (fresh) fresh.focus();
      });
      addRow.appendChild(input);
      menu.appendChild(addRow);
      menu.appendChild(el("div", "note", "Click a swatch to change its colour."));
    });
  }
  function saveLabels(next) {
    board.set({ labels: next });
    render();
  }

  // ---------- archive drawer ----------
  archiveBtn.addEventListener("click", function () {
    archiveEl.classList.toggle("hidden");
    archiveBtn.classList.toggle("on", !archiveEl.classList.contains("hidden"));
    renderArchive();
  });
  $("archiveClose").addEventListener("click", function () {
    archiveEl.classList.add("hidden");
    archiveBtn.classList.remove("on");
  });
  function renderArchive() {
    archiveBody.replaceChildren();
    var items = allCards().filter(function (c) { return c.archived; }).sort(function (a, b) { return (b.archivedAt || 0) - (a.archivedAt || 0); });
    if (!items.length) {
      archiveBody.appendChild(el("div", "empty-note", "Nothing archived. Archive a card from its menu, or a whole column from the column menu."));
      return;
    }
    items.forEach(function (c) {
      var row = el("div", "arch-row");
      var archTitle = el("div", "t");
      archTitle.innerHTML = "#" + c.num + " " + linkText(c.title);
      row.appendChild(archTitle);
      var col = column(c.col);
      row.appendChild(el("div", "sub", (col ? col.title + " · " : "") + "archived " + ago(c.archivedAt)));
      var btns = el("div", "row");
      var restore = el("button", "ghost", "Restore");
      restore.type = "button";
      restore.addEventListener("click", function () {
        updateCard(c.id, function (x) { delete x.archived; delete x.archivedAt; return x; });
      });
      var open = el("button", "ghost", "Open");
      open.type = "button";
      open.addEventListener("click", function () { openCard(c.id); });
      var del = el("button", "danger-btn", "Delete");
      del.type = "button";
      del.addEventListener("click", function () {
        askConfirm({
          title: "Delete #" + c.num + "?",
          text: "\u201c" + plainLinks(c.title) + "\u201d will be gone for good, with its comments and images."
        }).then(function (ok) {
          if (ok) deleteCard(c.id);
        });
      });
      btns.appendChild(restore);
      btns.appendChild(open);
      btns.appendChild(del);
      row.appendChild(btns);
      archiveBody.appendChild(row);
    });
  }

  // ---------- settings ----------
  var settingsBtn = $("settingsBtn"), settingsBack = $("settingsBack");
  var sHideAddColumn = $("sHideAddColumn"), sShowDoneDate = $("sShowDoneDate");
  function renderSettings() {
    var s = settings();
    sHideAddColumn.checked = Boolean(s.hideAddColumn);
    sShowDoneDate.checked = Boolean(s.showDoneDate);
  }
  function openSettings() {
    closeMenu();
    renderSettings();
    settingsBack.classList.remove("hidden");
    settingsBtn.classList.add("on");
    $("settingsClose").focus();
  }
  function closeSettings() {
    settingsBack.classList.add("hidden");
    settingsBtn.classList.remove("on");
    settingsBtn.focus();
  }
  function saveSetting(key, on) {
    var next = Object.assign({}, settings());
    if (on) next[key] = true;
    else delete next[key];
    board.set({ settings: next });
    render();
  }
  settingsBtn.addEventListener("click", function () {
    if (settingsBack.classList.contains("hidden")) openSettings();
    else closeSettings();
  });
  $("settingsClose").addEventListener("click", closeSettings);
  settingsBack.addEventListener("pointerdown", function (e) {
    if (e.target === settingsBack) closeSettings();
  });
  sHideAddColumn.addEventListener("change", function () { saveSetting("hideAddColumn", sHideAddColumn.checked); });
  sShowDoneDate.addEventListener("change", function () { saveSetting("showDoneDate", sShowDoneDate.checked); });
  // Capture phase, so Esc closes only the settings and not the card or archive behind them.
  window.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || settingsBack.classList.contains("hidden") || confirmDone) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    closeSettings();
  }, true);

  // ---------- toolbar ----------
  var searchTimer = 0;
  searchEl.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { setView({ q: searchEl.value }); }, 150);
  });
  fLabel.addEventListener("change", function () { setView({ label: fLabel.value }); });
  fPriority.addEventListener("change", function () { setView({ priority: fPriority.value }); });
  fAssignee.addEventListener("change", function () { setView({ assignee: fAssignee.value }); });
  fDue.addEventListener("change", function () { setView({ due: fDue.value }); });
  clearFilterBtn.addEventListener("click", function () {
    searchEl.value = "";
    board.set({ view: {} });
    render();
  });

  // ---------- global keys ----------
  $("mClose").addEventListener("click", closeCard);
  overlay.addEventListener("pointerdown", function (e) {
    if (e.target === overlay) closeCard();
  });
  document.addEventListener("pointerdown", function (e) {
    if (menuEl && !menuEl.contains(e.target)) closeMenu();
  });
  // Closed after the click is handled, so "+ Add a card" in another column still gets its click.
  document.addEventListener("click", function (e) {
    if (!composerCol || (e.target.closest && e.target.closest(".composer"))) return;
    composerCol = null;
    setTimeout(function () {
      if (!composerCol && boardEl.querySelector(".composer")) render();
    }, 0);
  }, true);

  // A vertical wheel scrolls the board sideways, except over a column list that has its own scrollbar.
  boardEl.addEventListener("wheel", function (e) {
    if (e.ctrlKey || drag || boardEl.scrollWidth <= boardEl.clientWidth) return;
    if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
    var list = e.target.closest && e.target.closest(".cards");
    if (list && list.scrollHeight > list.clientHeight + 1) return;
    if (e.target.closest && e.target.closest("textarea")) return;
    var unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? boardEl.clientWidth : 1;
    smoothScrollBoard(e.deltaY * unit);
    e.preventDefault();
  }, { passive: false });

  // Wheel steps move a target; the board eases toward it, so fast wheeling adds up instead
  // of restarting. Anything else moving the board mid-glide (scrollbar, drag) wins.
  var REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var glide = null;
  function smoothScrollBoard(dx) {
    var max = boardEl.scrollWidth - boardEl.clientWidth;
    if (REDUCED_MOTION) {
      boardEl.scrollLeft = clamp(boardEl.scrollLeft + dx, 0, max);
      return;
    }
    if (!glide) {
      glide = { pos: boardEl.scrollLeft, target: boardEl.scrollLeft, last: performance.now() };
      requestAnimationFrame(stepGlide);
    }
    glide.target = clamp(glide.target + dx, 0, max);
  }
  function stepGlide(now) {
    if (!glide) return;
    if (Math.abs(boardEl.scrollLeft - glide.pos) > 2) {
      glide = null;
      return;
    }
    var diff = glide.target - glide.pos;
    if (Math.abs(diff) < 1) {
      boardEl.scrollLeft = glide.target;
      glide = null;
      return;
    }
    // A frame's timestamp can precede the wheel event that started the glide.
    var dt = Math.min(64, now - glide.last);
    if (dt <= 0) {
      requestAnimationFrame(stepGlide);
      return;
    }
    glide.last = now;
    var step = diff * (1 - Math.exp(-dt / 65));
    if (Math.abs(step) < 0.5) step = Math.sign(diff) * Math.min(Math.abs(diff), 0.5);
    glide.pos += step;
    boardEl.scrollLeft = glide.pos;
    // scrollLeft snaps to device pixels; follow where it actually landed.
    glide.pos = Math.abs(boardEl.scrollLeft - glide.pos) <= 1 ? glide.pos : boardEl.scrollLeft;
    requestAnimationFrame(stepGlide);
  }
  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === "Escape") {
      if (!lightbox.classList.contains("hidden")) { lightbox.classList.add("hidden"); return; }
      if (menuEl) { closeMenu(); return; }
      if (openId && !typing) { closeCard(); return; }
      if (!archiveEl.classList.contains("hidden") && !typing) { archiveEl.classList.add("hidden"); archiveBtn.classList.remove("on"); }
      return;
    }
    if (e.key === "/" && !typing && !openId) {
      e.preventDefault();
      searchEl.focus();
    }
  });

  board.onChange(function () {
    ensureShape();
    render();
  });
  ensureShape();
  render();
})();
</script>
</body>
</html>
