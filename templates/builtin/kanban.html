<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e232c;
    --line: #2a3140;
    --text: #e8edf5;
    --muted: #8b95a8;
    --accent: #6ea8ff;
    --accent-2: #4f8ef7;
    --danger: #ff6b7a;
    --warn: #e0b34a;
    --ok: #3dd68c;
    --agent: #e0b34a;
    --radius: 14px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --edge-hi: inset 0 1px 0 rgba(255, 255, 255, .14);
    --edge-lo: 0 1px 0 rgba(0, 0, 0, .42);
    --depth: var(--edge-hi), var(--edge-lo);
    --depth-hover: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 0 rgba(0, 0, 0, .5);
    --col-w: 284px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 9px; color: inherit; background: none; }
  button:disabled { opacity: .35; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); }
  .hidden { display: none !important; }

  header { padding: 22px 24px 12px; flex: 0 0 auto; }
  .head-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.03em; line-height: 1.2; }
  .meta { color: var(--muted); font-size: 13px; padding-bottom: 3px; }
  .toolbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .field {
    background: var(--panel);
    border: 0;
    border-radius: 10px;
    padding: 7px 10px;
    box-shadow: var(--depth);
    outline: none;
    min-width: 0;
  }
  .field:focus { box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  /* Themed dropdown standing in for each <select> (see enhanceSelect). */
  .select-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    max-width: 220px;
    padding: 7px 32px 7px 10px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
  }
  .side .select-btn { max-width: none; }
  .select-btn:hover { box-shadow: var(--depth-hover); }
  .select-btn.open { box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  .select-btn .select-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .select-btn .select-text.muted { color: var(--muted); }
  .select-btn::after {
    content: "";
    position: absolute;
    right: 13px;
    top: 50%;
    width: 6px;
    height: 6px;
    margin-top: -5px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg);
    transition: transform 150ms var(--ease), margin-top 150ms var(--ease);
  }
  .select-btn.open::after { margin-top: -1px; transform: rotate(225deg); }
  .select-list {
    position: fixed;
    z-index: 100; /* above dialogs (.confirm-back) that hold selects */
    min-width: 160px;
    max-height: 300px;
    overflow-y: auto;
    padding: 4px;
    border-radius: 11px;
    background: rgba(18, 22, 30, .98);
    box-shadow: var(--depth), 0 14px 40px rgba(0, 0, 0, .5);
    animation: select-in 110ms var(--ease);
  }
  @keyframes select-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .select-list button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 7px 10px 7px 8px;
    border-radius: 7px;
    white-space: nowrap;
    color: var(--text);
  }
  .select-list button .tick-mark { width: 14px; flex: 0 0 auto; color: var(--accent); font-size: 12px; }
  .select-list button.active { background: rgba(255, 255, 255, .08); }
  .select-list button[aria-selected="true"] { font-weight: 600; }
  .select-list button.placeholder { color: var(--muted); }
  .select-list.has-search {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-height: min(360px, calc(100vh - 24px));
  }
  .select-list .menu-search { width: 100%; margin: 0 0 4px; flex: 0 0 auto; }
  .select-list .select-opts { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .select-list .empty-row { color: var(--muted); padding: 7px 9px; font-size: 12.5px; }
  .search { width: 220px; }
  .tool {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    box-shadow: var(--depth);
    padding: 7px 12px;
    min-height: calc(1.45em + 14px);
    color: var(--muted);
  }
  .tool:hover { color: var(--text); box-shadow: var(--depth-hover); }
  .tool.on { color: var(--text); box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  .tool.icon { padding: 7px 10px; min-width: calc(1.45em + 14px); }
  .tool.icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .spacer { flex: 1; }

  .board {
    flex: 1 1 auto;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 6px 24px 24px;
    overflow: auto;
    min-height: 0;
  }
  .column {
    flex: 0 0 var(--col-w);
    width: var(--col-w);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, .025);
    border-radius: var(--radius);
    box-shadow: var(--depth);
    min-height: 90px;
  }
  .column.col-dragging { opacity: .35; }
  .col-slot {
    flex: 0 0 var(--col-w);
    align-self: stretch;
    border: 1px dashed var(--accent);
    border-radius: var(--radius);
  }
  .col-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 8px 8px 10px;
    cursor: grab;
    user-select: none;
  }
  .col-title, .col-title-input {
    font: 650 12.5px/1.3 ui-sans-serif, system-ui, Segoe UI, sans-serif;
    letter-spacing: .05em;
    text-transform: uppercase;
    border-radius: 7px;
    padding: 4px 6px;
  }
  .col-title {
    color: var(--muted);
    cursor: text;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .col-title:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
  .col-title-input {
    flex: 1;
    min-width: 0;
    background: rgba(8, 12, 20, .35);
    border: 0;
    outline: none;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .role {
    flex: 0 0 auto;
    font-size: 11px;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 6px;
    background: rgba(255, 255, 255, .06);
    color: var(--muted);
  }
  .role.agent, .role.working { color: var(--agent); background: rgba(224, 179, 74, .12); }
  .role.review { color: var(--accent); background: rgba(110, 168, 255, .12); }
  .role.done { color: var(--ok); background: rgba(61, 214, 140, .12); }
  .col-count {
    margin-left: auto;
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--muted);
    background: rgba(255, 255, 255, .06);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .col-count.at { color: var(--warn); background: rgba(224, 179, 74, .14); }
  .col-count.over { color: var(--danger); background: rgba(255, 107, 122, .14); }
  .col-menu-btn {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
  }
  .col-menu-btn:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .cards {
    list-style: none;
    margin: 0;
    padding: 2px 8px 4px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    min-height: 12px;
    flex: 1 1 auto;
  }
  .add-card {
    margin: 2px 8px 8px;
    padding: 7px 8px;
    text-align: left;
    color: var(--muted);
    border-radius: 10px;
  }
  .add-card:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
  .composer { margin: 2px 8px 8px; }
  .composer textarea {
    width: 100%;
    resize: none;
    background: var(--panel);
    border: 0;
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: var(--depth), 0 0 0 1px var(--accent);
    outline: none;
    min-height: 58px;
  }
  .composer .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .primary {
    background: var(--accent);
    color: #0b1220;
    font-weight: 650;
    padding: 6px 12px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .38), 0 1px 0 rgba(11, 18, 32, .28);
  }
  .primary:hover { background: var(--accent-2); }
  .ghost { padding: 6px 10px; color: var(--muted); }
  .ghost:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .danger-btn { padding: 6px 10px; color: var(--danger); }
  .danger-btn:hover { background: rgba(255, 107, 122, .12); }

  .add-column {
    flex: 0 0 var(--col-w);
    padding: 12px;
    text-align: left;
    color: var(--muted);
    border-radius: var(--radius);
    border: 1px dashed var(--line);
  }
  .add-column:hover { color: var(--text); border-color: var(--muted); }

  .card {
    position: relative;
    background: var(--panel);
    border-radius: 11px;
    padding: 9px 10px 8px;
    box-shadow: var(--depth);
    cursor: pointer;
    user-select: none;
    touch-action: none;
    border-left: 3px solid transparent;
  }
  .card:hover { box-shadow: var(--depth-hover); }
  .card.p1 { border-left-color: #6b7a93; }
  .card.p2 { border-left-color: var(--accent); }
  .card.p3 { border-left-color: var(--warn); }
  .card.p4 { border-left-color: var(--danger); }
  .card.is-done .card-title { color: var(--muted); }
  .card.is-done { opacity: .72; }
  .card.src { visibility: hidden; }
  .card.ghost-card {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    transform: rotate(1.5deg) scale(1.02);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 10px 26px rgba(0, 0, 0, .5);
  }
  .column.ghost-col {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    transform: rotate(1deg);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
    background: #1a1e27;
  }
  .card-slot {
    flex: 0 0 auto;
    border: 1px dashed var(--accent);
    border-radius: 11px;
  }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  .cover {
    display: block;
    width: calc(100% + 20px);
    margin: -9px -10px 8px;
    max-height: 180px;
    height: auto;
    object-fit: contain;
    object-position: center;
    border-radius: 9px 11px 0 0;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chip-bar { height: 6px; width: 28px; border-radius: 3px; }
  .card-title { word-break: break-word; }
  .num { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px 9px; margin-top: 6px; color: var(--muted); font-size: 11.5px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .badge.soon { color: var(--warn); }
  .badge.late { color: var(--danger); }
  .badge.full { color: var(--ok); }
  .badge .ic { width: 13px; height: 13px; flex: 0 0 auto; }
  .badge .ic .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .badge .ic .mark { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .badge.full .ic .box { fill: var(--ok); stroke: var(--ok); }
  .badge.full .ic .mark { stroke: #0b1a12; }
  .badge.blocked { color: var(--danger); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 700;
    background: #2c3546;
    color: var(--text);
    margin-left: auto;
  }
  .avatar.agent { background: rgba(224, 179, 74, .2); }
  .status {
    margin-top: 7px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .status.working { color: var(--agent); }
  .status.blocked { color: var(--danger); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--agent); animation: pulse 1.4s ease-in-out infinite; flex: 0 0 auto; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .review-row { display: flex; gap: 6px; margin-top: 8px; }
  .review-row button { flex: 1; padding: 5px 6px; font-size: 12px; font-weight: 600; }
  .approve { background: rgba(61, 214, 140, .15); color: var(--ok); }
  .approve:hover { background: rgba(61, 214, 140, .25); }
  .changes { background: rgba(224, 179, 74, .13); color: var(--warn); }
  .changes:hover { background: rgba(224, 179, 74, .23); }

  .menu {
    position: fixed;
    z-index: 70;
    min-width: 200px;
    background: rgba(18, 22, 30, .97);
    border-radius: 12px;
    box-shadow: var(--depth), 0 14px 40px rgba(0, 0, 0, .45);
    padding: 6px;
  }
  .menu > button, .menu .menu-row {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 8px;
    text-align: left;
    padding: 7px 9px;
    border-radius: 8px;
  }
  .menu > button:hover:not(:disabled) { background: rgba(255, 255, 255, .07); }
  .menu .sep { height: 1px; background: var(--line); margin: 5px 4px; }
  .menu .label { color: var(--muted); font-size: 11.5px; padding: 6px 9px 2px; text-transform: uppercase; letter-spacing: .05em; }
  .menu .check-mark { width: 14px; color: var(--accent); }
  .menu input[type=number] { width: 70px; }
  .menu .note { color: var(--muted); font-size: 11.5px; padding: 0 9px 6px; }
  .menu .menu-sub { position: relative; }
  .menu .menu-sub > button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; padding: 7px 9px; border-radius: 8px; }
  .menu .menu-sub:hover > button { background: rgba(255, 255, 255, .07); }
  .menu .sub-arrow { margin-left: auto; color: var(--muted); }
  .menu .submenu { display: none; position: absolute; top: -6px; left: 100%; min-width: 150px; }
  .menu .menu-sub:hover > .submenu, .menu .menu-sub:focus-within > .submenu { display: block; }
  .menu .menu-sub.flip > .submenu { left: auto; right: 100%; }
  .menu .prio-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .35; }
  .menu .prio-dot.p1 { background: #6b7a93; opacity: 1; }
  .menu .prio-dot.p2 { background: var(--accent); opacity: 1; }
  .menu .prio-dot.p3 { background: var(--warn); opacity: 1; }
  .menu .prio-dot.p4 { background: var(--danger); opacity: 1; }
  .menu > button.danger-item { color: var(--danger); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 20, .14);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 36px 16px 32px;
    z-index: 40;
    overflow: auto;
  }
  .modal {
    width: min(780px, 100%);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    background-color: rgba(10, 14, 22, .86);
    backdrop-filter: blur(22px) saturate(1.4);
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    border-radius: 18px;
    box-shadow: var(--depth), 0 18px 50px rgba(0, 0, 0, .25);
    padding: 20px 22px 18px;
    position: relative;
  }
  .modal.drop-target { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    background: rgba(255, 255, 255, .08);
    color: var(--muted);
    box-shadow: var(--depth);
    font-size: 18px;
  }
  .modal-close:hover { color: var(--text); }
  .m-head { padding-right: 40px; margin-bottom: 14px; }
  .m-num { color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .m-title {
    margin: 0;
    font-size: 21px;
    letter-spacing: -0.02em;
    line-height: 1.3;
    border-radius: 8px;
    padding: 3px 6px;
    margin-left: -6px;
    cursor: text;
    word-break: break-word;
  }
  .m-title:hover { background: rgba(255, 255, 255, .06); }
  .m-title-input {
    width: 100%;
    font: 650 21px/1.3 ui-sans-serif, system-ui, Segoe UI, sans-serif;
    letter-spacing: -0.02em;
    background: rgba(8, 12, 20, .3);
    border: 0;
    border-radius: 8px;
    padding: 3px 6px;
    margin-left: -6px;
    outline: none;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .m-grid { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 20px; }
  @media (max-width: 700px) { .m-grid { grid-template-columns: 1fr; } }
  .side { display: flex; flex-direction: column; gap: 10px; }
  .side label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .side .field { width: 100%; }
  .section-label {
    font-size: 11.5px;
    font-weight: 650;
    color: var(--muted);
    letter-spacing: .05em;
    text-transform: uppercase;
    margin: 16px 0 7px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label:first-child { margin-top: 0; }
  .cover-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    text-transform: none;
    letter-spacing: 0;
    font-size: 12px;
    font-weight: 550;
    color: var(--text);
    cursor: pointer;
  }
  .cover-toggle .switch {
    width: 28px;
    height: 16px;
    margin: 0;
    box-shadow: none;
  }
  .cover-toggle .switch::after {
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
  }
  .cover-toggle .switch:checked::after { transform: translateX(12px); }
  .label-picks { display: flex; flex-wrap: wrap; gap: 5px; }
  .label-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: color-mix(in srgb, var(--chip) 22%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--chip) 38%, transparent);
  }
  .label-chip .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--chip); }
  .label-chip .rmx { width: 0; overflow: hidden; opacity: 0; color: var(--muted); transition: width 120ms var(--ease), opacity 120ms var(--ease); }
  .label-chip:hover .rmx, .label-chip:focus-visible .rmx { width: 9px; opacity: 1; }
  .label-chip:hover { background: color-mix(in srgb, var(--chip) 30%, transparent); }
  .label-add {
    display: inline-flex;
    align-items: center;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
    border: 1px dashed rgba(139, 149, 168, .55);
  }
  .label-add:hover, .label-add.open { color: var(--text); border-color: var(--text); }
  .menu .menu-search { width: 100%; margin-bottom: 4px; }
  .menu .pick-row {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 8px;
    text-align: left;
    padding: 7px 9px;
    border-radius: 8px;
  }
  .menu .pick-row .sw { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .menu .pick-row.active { background: rgba(255, 255, 255, .07); }
  .menu .pick-row .hint-key { margin-left: auto; color: var(--muted); font-size: 11px; }
  .menu .empty-row { color: var(--muted); padding: 7px 9px; font-size: 12.5px; }
  .combo { position: relative; }
  .combo .field { width: 100%; padding-right: 30px; }
  .combo-clear {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
  }
  .combo-clear:hover { color: var(--text); background: rgba(255, 255, 255, .08); }
  .select-list .avatar { margin-left: 0; width: 20px; height: 20px; }
  .select-list .assign-new { color: var(--muted); }

  .md-preview {

  .md-preview a { color: var(--accent); }
  .page-link { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
  .page-link:hover { border-bottom-style: solid; }
  .md-preview code { font: 12.5px/1.45 ui-monospace, Consolas, monospace; background: #0f1115; padding: .1em .35em; border-radius: 5px; }
  .md-preview pre { background: #0f1115; padding: 10px 12px; border-radius: 8px; overflow: auto; }
  .md-preview pre code { padding: 0; background: none; }
  .md-preview img { max-width: 100%; border-radius: 8px; display: block; margin: 8px 0; cursor: zoom-in; }
  .md-editor {
    width: 100%;
    min-height: 150px;
    padding: 10px 12px;
    background: rgba(8, 12, 20, .35);
    border: 0;
    border-radius: 12px;
    font: 13px/1.5 ui-monospace, Consolas, monospace;
    resize: vertical;
    outline: none;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .progress { flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ok); }
  .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .checklist li { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 8px; }
  .checklist li:hover { background: rgba(255, 255, 255, .04); }
  .checklist li span { flex: 1; min-width: 0; word-break: break-word; cursor: pointer; user-select: none; }
  .checklist .ck-edit { flex: 1; min-width: 0; padding: 3px 8px; }
  .checklist li.done span { color: var(--muted); text-decoration: line-through; }
  .checklist .x { visibility: hidden; color: var(--muted); padding: 0 6px; }
  .checklist li:hover .x { visibility: visible; }
  .checklist .x:hover { color: var(--danger); }
  .tick {
    appearance: none;
    width: 16px;
    height: 16px;
    margin: 0;
    border-radius: 5px;
    background: rgba(255, 255, 255, .06);
    box-shadow: var(--depth);
    cursor: pointer;
    flex: 0 0 auto;
  }
  .tick:checked { background: var(--ok); }
  .inline-add { display: flex; gap: 6px; margin-top: 6px; }
  .inline-add .field { flex: 1; }
  .gallery { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; background: rgba(8, 12, 20, .35); box-shadow: var(--depth); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
  .thumb .rm { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 7px; background: rgba(15, 17, 21, .8); font-size: 14px; line-height: 1; }
  .thumb .rm:hover { color: var(--danger); }
  .add-img { width: 84px; height: 84px; background: rgba(255, 255, 255, .04); color: var(--muted); font-size: 26px; box-shadow: var(--depth); border-radius: 10px; }
  .add-img:hover { color: var(--text); }
  .links { display: flex; flex-direction: column; gap: 4px; }
  .link-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; background: rgba(255, 255, 255, .03); }
  .link-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .link-row span:hover { text-decoration: underline; }
  .link-row.open-blocker { box-shadow: inset 2px 0 0 var(--danger); }
  .comments { display: flex; flex-direction: column; gap: 8px; }
  .comment { padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .04); }
  .comment.agent { background: rgba(224, 179, 74, .07); box-shadow: inset 2px 0 0 var(--agent); }
  .comment .who { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .comment .body { word-break: break-word; }
  .comment .body.md-preview { min-height: 0; padding: 0; background: none; box-shadow: none; border-radius: 0; cursor: auto; }
  .comment-box { width: 100%; min-height: 58px; resize: vertical; }
  .m-status { padding: 8px 10px; border-radius: 10px; background: rgba(224, 179, 74, .08); color: var(--agent); display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .m-status.blocked { background: rgba(255, 107, 122, .1); color: var(--danger); }
  .m-status .clear { margin-left: auto; color: var(--muted); font-size: 12px; padding: 2px 6px; }
  .times { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; }
  .actions button { background: rgba(255, 255, 255, .05); padding: 6px 10px; }
  .actions button:hover { background: rgba(255, 255, 255, .1); }
  .hint { color: var(--muted); font-size: 12px; margin: 14px 0 0; min-height: 1.2em; }
  .hint.error { color: var(--danger); }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(380px, 100%);
    z-index: 45;
    background: rgba(12, 16, 24, .96);
    box-shadow: -1px 0 0 var(--line), -18px 0 50px rgba(0, 0, 0, .35);
    display: flex;
    flex-direction: column;
  }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 10px; }
  .drawer-head h2 { margin: 0; font-size: 17px; flex: 1; }
  .drawer-body { overflow: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 7px; }
  .arch-row { background: var(--panel); border-radius: 10px; padding: 8px 10px; box-shadow: var(--depth); }
  .arch-row .t { word-break: break-word; }
  .arch-row .sub { color: var(--muted); font-size: 11.5px; margin: 2px 0 6px; }
  .arch-row .row { display: flex; gap: 4px; }
  .label-edit { display: flex; align-items: center; gap: 6px; }
  .label-edit .field { flex: 1; }
  .swatch { width: 22px; height: 22px; border-radius: 7px; flex: 0 0 auto; box-shadow: var(--depth); }
  .palette { display: flex; gap: 5px; flex-wrap: wrap; padding: 4px 0 2px; }
  .palette button { width: 20px; height: 20px; border-radius: 6px; }
  .palette button.on { box-shadow: 0 0 0 2px var(--text); }
  .empty-note { color: var(--muted); text-align: center; padding: 24px 12px; }
  .confirm-back {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(8, 12, 20, .35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .confirm-box {
    width: min(400px, 100%);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    background-color: rgba(12, 16, 24, .96);
    border-radius: 16px;
    box-shadow: var(--depth), 0 18px 50px rgba(0, 0, 0, .4);
    padding: 20px 20px 16px;
    animation: confirm-in 120ms var(--ease);
  }
  @keyframes confirm-in { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .confirm-box h3 { margin: 0 0 6px; font-size: 16px; letter-spacing: -0.01em; }
  .confirm-box p { margin: 0; color: var(--muted); word-break: break-word; }
  .confirm-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .confirm-row .ghost { background: rgba(255, 255, 255, .05); }
  .confirm-row .danger-solid {
    padding: 6px 14px;
    font-weight: 650;
    background: var(--danger);
    color: #1a0b0e;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 1px 0 rgba(0, 0, 0, .3);
  }
  .confirm-row .danger-solid:hover { background: #ff8592; }
  .confirm-row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .settings-box { width: min(440px, 100%); }
  /* Agent workers: a launch button in an agent column's header, its setup, and the stop choice. */
  .worker-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    line-height: 1;
    padding: 4px 7px;
    border-radius: 7px;
    color: var(--agent);
    background: rgba(224, 179, 74, .12);
  }
  .worker-btn:hover { background: rgba(224, 179, 74, .22); }
  .worker-btn svg { width: 10px; height: 10px; fill: currentColor; }
  .worker-btn:disabled { opacity: .6; }
  .worker-btn.waiting { color: var(--muted); background: rgba(255, 255, 255, .05); }
  .worker-btn.waiting .pulse { background: var(--muted); }
  .worker-error { margin: -2px 10px 6px; font-size: 12px; color: var(--danger); }
  .worker-error button { color: var(--text); text-decoration: underline; padding: 0; margin-left: 4px; }
  .workers-section { border-top: 1px solid rgba(255, 255, 255, .06); padding-top: 12px; }
  .workers-section h4 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
  .workers-section > p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
  .worker-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .worker-row .txt { flex: 1; min-width: 0; }
  .worker-row .txt b { display: block; font-weight: 600; }
  .worker-row .txt span { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .worker-box { width: min(560px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
  .worker-form { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; align-items: center; overflow-y: auto; padding: 10px 2px 2px; }
  .worker-form > label { color: var(--muted); font-size: 12.5px; }
  .worker-form > label.top { align-self: start; padding-top: 7px; }
  .worker-form .field { width: 100%; }
  .worker-form textarea.field { min-height: 120px; resize: vertical; line-height: 1.45; }
  .worker-form .row { display: flex; gap: 8px; min-width: 0; }
  .worker-form .row .field { flex: 1; }
  .worker-form .help { grid-column: 2; margin: -4px 0 0; color: var(--muted); font-size: 12px; }
  .worker-form .worker-hint { grid-column: 1 / -1; margin: 0 0 4px; }
  .worker-form .worker-hint summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .worker-form .worker-hint summary:hover { color: var(--text); }
  .worker-form .worker-hint > p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .worker-form .worker-hint pre {
    margin: 8px 0 0;
    padding: 10px 12px;
    max-height: 240px;
    overflow: auto;
    font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    color: var(--text);
    background: rgba(255, 255, 255, .04);
    border-radius: 8px;
  }
  .worker-form .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .worker-note { margin: 10px 0 0; color: var(--muted); font-size: 12.5px; }
  .worker-note.warn { color: var(--agent); }
  .confirm-row .spacer { flex: 1; }
  #confirmBack { z-index: 95; }
  .confirm-row .accent-solid { padding: 6px 14px; font-weight: 650; background: var(--accent); color: #0b1220; }
  .setting { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; cursor: pointer; }
  .setting + .setting { border-top: 1px solid rgba(255, 255, 255, .06); }
  .setting .txt { flex: 1; }
  .setting .txt b { display: block; font-weight: 600; margin-bottom: 2px; }
  .setting .txt span { color: var(--muted); font-size: 12.5px; }
  .switch {
    appearance: none;
    -webkit-appearance: none;
    flex: 0 0 auto;
    width: 34px;
    height: 20px;
    margin: 1px 0 0;
    border-radius: 10px;
    background: rgba(255, 255, 255, .12);
    box-shadow: var(--depth);
    position: relative;
    cursor: pointer;
    transition: background 120ms var(--ease);
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text);
    transition: transform 120ms var(--ease);
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(14px); background: #0b1220; }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .84); display: flex; align-items: center; justify-content: center; z-index: 80; padding: 24px; cursor: zoom-out; }
  .lightbox img { max-width: min(1200px, 100%); max-height: 100%; border-radius: 10px; }
  .need-reload { margin: 40px auto; max-width: 480px; color: var(--muted); text-align: center; }
</style>

<body>
  <header>
    <div class="head-row">
      <h1>{{title}}</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="toolbar" id="toolbar">
      <input class="field search" id="search" type="search" placeholder="Search cards   /" autocomplete="off">
      <select class="field" id="fLabel" aria-label="Filter by label"></select>
      <select class="field" id="fPriority" aria-label="Filter by priority"></select>
      <select class="field" id="fAssignee" aria-label="Filter by assignee"></select>
      <select class="field" id="fDue" aria-label="Filter by due date">
        <option value="">Any due date</option>
        <option value="late">Overdue</option>
        <option value="soon">Due in 7 days</option>
        <option value="none">No due date</option>
      </select>
      <button class="tool hidden" id="clearFilter" type="button">Clear filter</button>
      <span class="spacer"></span>
      <button class="tool" id="labelsBtn" type="button">Labels</button>
      <button class="tool" id="archiveBtn" type="button">Archive</button>
      <button class="tool icon" id="settingsBtn" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </header>
  <main class="board" id="board"></main>

  <div class="overlay hidden" id="overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <button class="modal-close" id="mClose" type="button" aria-label="Close">×</button>
      <div class="m-head">
        <div class="m-num" id="mNum"></div>
        <h2 class="m-title" id="mTitle"></h2>
        <input class="m-title-input hidden" id="mTitleInput" type="text" autocomplete="off">
      </div>
      <div class="m-status hidden" id="mStatus"></div>
      <div class="m-grid">
        <div>
          <div class="section-label">Description</div>
          <div class="md-preview" id="mdPreview"></div>
          <textarea class="md-editor hidden" id="mdEditor" placeholder="Markdown. Paste an image to embed it. Ctrl+Enter saves."></textarea>

          <div class="section-label">Checklist <span class="progress" id="clProgress"><i></i></span><span id="clCount"></span></div>
          <ul class="checklist" id="checklist"></ul>
          <div class="inline-add">
            <input class="field" id="clInput" type="text" placeholder="Add an item" autocomplete="off">
          </div>

          <div class="section-label">Images <label class="cover-toggle hidden" id="coverToggle" title="Show the first image on the board card">Show cover<input class="switch" id="coverSwitch" type="checkbox"></label></div>
          <div class="gallery" id="gallery"></div>

          <div class="section-label">Comments</div>
          <div class="comments" id="comments"></div>
          <div class="inline-add" style="flex-direction:column">
            <textarea class="field comment-box" id="commentBox" placeholder="Write a comment. Ctrl+Enter posts."></textarea>
            <div><button class="primary" id="commentPost" type="button">Comment</button></div>
          </div>
        </div>
        <div class="side">
          <label>Column<select class="field" id="mColumn"></select></label>
          <label>Priority<select class="field" id="mPriority"></select></label>
          <label>Due<input class="field" id="mDue" type="date"></label>
          <label>Assignee<span class="combo"><input class="field" id="mAssignee" type="text" placeholder="Nobody" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false"><button class="combo-clear hidden" id="mAssigneeClear" type="button" title="Unassign" aria-label="Unassign">×</button></span></label>
          <div>
            <div class="section-label" style="margin-top:4px">Labels</div>
            <div class="label-picks" id="mLabels"></div>
          </div>
          <div>
            <div class="section-label" style="margin-top:4px">Blocked by</div>
            <div class="links" id="mLinks"></div>
            <select class="field" id="mLinkAdd" data-search="Filter cards" style="width:100%;margin-top:6px"></select>
          </div>
          <div class="review-row hidden" id="mReview">
            <button class="approve" id="mApprove" type="button">Approve</button>
            <button class="changes" id="mChanges" type="button">Request changes</button>
          </div>
          <div class="actions">
            <button id="mDup" type="button">Duplicate</button>
            <button id="mArchive" type="button">Archive</button>
            <button id="mDelete" type="button">Delete</button>
          </div>
          <div class="times" id="mTimes"></div>
        </div>
      </div>
      <p class="hint" id="hint"></p>
    </div>
  </div>

  <aside class="drawer hidden" id="archive">
    <div class="drawer-head"><h2>Archive</h2><button class="ghost" id="archiveClose" type="button">Close</button></div>
    <div class="drawer-body" id="archiveBody"></div>
  </aside>
  <div class="lightbox hidden" id="lightbox"><img id="lightboxImg" alt=""></div>
  <div class="confirm-back hidden" id="confirmBack">

      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
      <div class="confirm-row">
        <button class="ghost" id="confirmCancel" type="button">Cancel</button>
        <button class="danger-solid" id="confirmOk" type="button"></button>
      </div>
    </div>
  </div>
  <div class="confirm-back hidden" id="settingsBack">
    <div class="confirm-box settings-box" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h3 id="settingsTitle">Board settings</h3>
      <label class="setting">
        <span class="txt"><b>Hide "Add column"</b><span>Removes the add column button at the end of the board.</span></span>
        <input class="switch" id="sHideAddColumn" type="checkbox">
      </label>
      <label class="setting">
        <span class="txt"><b>Show done date on cards</b><span>Cards that are done show when they were completed.</span></span>
        <input class="switch" id="sShowDoneDate" type="checkbox">

      <div class="workers-section hidden" id="sWorkers"></div>
      <div class="confirm-row">
        <button class="ghost" id="settingsClose" type="button">Close</button>
      </div>
    </div>
  </div>
  <div class="confirm-back hidden" id="workerBack">

      <h3 id="workerTitle">Agent worker</h3>
      <p id="workerIntro">Takes this column's cards one by one, following your instructions, and waits for more.</p>
      <div class="worker-form" id="workerForm"></div>
      <p class="worker-note hidden" id="workerNote"></p>
      <div class="confirm-row">
        <button class="ghost" id="workerRemove" type="button">Remove worker</button>
        <span class="spacer"></span>
        <button class="ghost" id="workerClose" type="button">Done</button>
      </div>
    </div>
  </div>
  <div class="confirm-back hidden" id="stopBack">
    <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="stopTitle" aria-describedby="stopText">
      <h3 id="stopTitle">Stop the agent?</h3>
      <p id="stopText"></p>
      <div class="confirm-row">
        <button class="ghost" id="stopCancel" type="button">Cancel</button>
        <button class="ghost" id="stopLater" type="button">Stop when its card is done</button>
        <button class="danger-solid" id="stopNow" type="button">Stop now</button>
      </div>
    </div>
  </div>
  <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>

<script>
(function () {
  if (!window.scribe) {
    document.getElementById("board").innerHTML = "<p class='need-reload'>Reload the Scribe tab so this page can use shared state.</p>";
    return;
  }

  // ---------- constants ----------
  var values = (scribe.template && scribe.template.values) || {};
  var AGENT_MODE = values.agentMode !== false;
  var PRESETS = {
    simple: [["To do"], ["Doing"], ["Done", "done"]],

    if (document.activeElement !== searchEl) searchEl.value = str(v.q);
    fillSelect(fLabel, [["", "Any label"]].concat(labels().map(function (l) { return [l.id, l.name]; })), v.label);
    fillSelect(fPriority, [["", "Any priority"]].concat(PRIORITIES.map(function (p, i) { return [String(i), p]; })), v.priority);
    fillSelect(fAssignee, [["", "Anyone"], ["__none", "Unassigned"]].concat(assigneeNames().map(function (n) { return [n, n]; })), v.assignee);
    fDue.value = str(v.due);
    syncSelect(fDue);
    clearFilterBtn.classList.toggle("hidden", !filterActive());
    var archived = allCards().length - liveCards().length;
    archiveBtn.textContent = archived ? "Archive (" + archived + ")" : "Archive";
    var live = liveCards();
    var shown = filterActive() ? live.filter(matches) : live;
    var done = shown.filter(isDone).length;
    var count = shown.length + (shown.length === 1 ? " card" : " cards");
    if (filterActive() && shown.length !== live.length) count = shown.length + " of " + live.length + " cards";
    metaEl.textContent = count + (done ? " · " + done + " done" : "");
  }

  // ---------- board rendering ----------
  function render() {
    if (drag) return;
    refreshWorkerThreads();
    scheduleWorkers();
    renderToolbar();
    renderBoard();
    if (openId) renderModal();
    if (!archiveEl.classList.contains("hidden")) renderArchive();
    if (!settingsBack.classList.contains("hidden")) renderSettings();
  }

  function renderBoard() {
    var scrollLeft = boardEl.scrollLeft;
    var listScroll = {};
    boardEl.querySelectorAll(".cards").forEach(function (list) { listScroll[list.dataset.col] = list.scrollTop; });
    var focusComposer = document.activeElement && document.activeElement.classList.contains("composer-input");
    boardEl.replaceChildren();
    var filtering = filterActive();
    columns().forEach(function (col) {
      var colEl = el("section", "column");
      colEl.dataset.col = col.id;
      var head = el("div", "col-head");
      head.dataset.col = col.id;
      if (editingCol === col.id) {
        var input = el("input", "col-title-input");
        input.value = col.title;
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") input.blur();
          if (e.key === "Escape") { editingCol = null; render(); }
        });
        input.addEventListener("blur", function () {
          if (editingCol !== col.id) return;
          editingCol = null;
          var title = input.value.trim();
          if (title && title !== col.title) {
            setColumns(columns().map(function (c) { return c.id === col.id ? Object.assign({}, c, { title: title }) : c; }));
          } else render();
        });
        head.appendChild(input);
        setTimeout(function () { input.focus(); input.select(); }, 0);
      } else {
        var title = el("span", "col-title", col.title || "Untitled");
        title.title = "Rename";
        title.addEventListener("click", function (e) {
          e.stopPropagation();
          editingCol = col.id;
          render();
        });
        head.appendChild(title);
        if (col.role && ROLE_TAG[col.role] && (AGENT_MODE || col.role === "done")) {
          head.appendChild(el("span", "role " + col.role, ROLE_TAG[col.role]));
        }
        var workerBtn = AGENT_MODE && col.role === "agent" ? workerButton(col) : null;
        if (workerBtn) head.appendChild(workerBtn);
      }
      var list = cardsIn(col.id);
      var visible = filtering ? list.filter(matches) : list;
      var count = el("span", "col-count", col.wip ? list.length + " / " + col.wip : String(visible.length));
      if (col.wip && list.length === col.wip) count.classList.add("at");
      if (col.wip && list.length > col.wip) count.classList.add("over");
      if (col.wip) count.title = "Work-in-progress limit " + col.wip;
      head.appendChild(count);
      var menuBtn = el("button", "col-menu-btn", "⋯");
      menuBtn.type = "button";
      menuBtn.setAttribute("aria-label", "Column menu");
      menuBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        openColumnMenu(col, menuBtn);
      });
      head.appendChild(menuBtn);
      head.addEventListener("pointerdown", function (e) { startColumnDrag(e, col.id, colEl); });
      colEl.appendChild(head);
      var workerError = workerErrorRow(col);
      if (workerError) colEl.appendChild(workerError);

      var ul = el("ul", "cards");
      ul.dataset.col = col.id;
      visible.forEach(function (c) {
        ul.appendChild(renderCard(c, col));
      });
      colEl.appendChild(ul);

      if (composerCol === col.id) {
        colEl.appendChild(renderComposer(col));
      } else {
        var add = el("button", "add-card", "+ Add a card");
        add.type = "button";
        add.addEventListener("click", function () {
          composerCol = col.id;
          focusComposerNext = true;
          render();
        });
        colEl.appendChild(add);
      }
      boardEl.appendChild(colEl);
    });
    var addCol = el("button", "add-column", "+ Add column");
    addCol.type = "button";
    addCol.addEventListener("click", function () {
      var col = { id: newId("col"), title: "New column" };
      editingCol = col.id;
      setColumns(columns().concat([col]));
      boardEl.scrollLeft = boardEl.scrollWidth;
    });
    if (!settings().hideAddColumn) boardEl.appendChild(addCol);
    boardEl.scrollLeft = scrollLeft;
    boardEl.querySelectorAll(".cards").forEach(function (list) {
      if (listScroll[list.dataset.col]) list.scrollTop = listScroll[list.dataset.col];
    });
    if (focusComposer || focusComposerNext) {
      focusComposerNext = false;
      var ta = boardEl.querySelector(".composer-input");
      if (ta) ta.focus();
    }
  }

  function renderCard(c, col) {
    var li = el("li", "card p" + c.priority);
    li.dataset.id = c.id;
    var done = col && col.role === "done";
    if (done) li.classList.add("is-done");
    if (c.images.length && c.cover !== false) {
      var cover = el("img", "cover");
      cover.src = c.images[0].data;
      cover.alt = "";
      cover.draggable = false;
      li.appendChild(cover);
    }
    var labelMap = {};
    labels().forEach(function (l) { labelMap[l.id] = l; });
    var chosen = c.labels.map(function (id) { return labelMap[id]; }).filter(Boolean);
    if (chosen.length) {
      var chips = el("div", "chips");
      chosen.forEach(function (l) {
        var bar = el("span", "chip-bar");
        bar.style.background = l.color;
        bar.title = l.name;
        chips.appendChild(bar);
      });
      li.appendChild(chips);
    }
    var titleEl = el("div", "card-title");
    titleEl.appendChild(el("span", "num", "#" + c.num));
    var titleText = el("span", "");
    titleText.innerHTML = linkText(c.title);
    titleEl.appendChild(titleText);
    li.appendChild(titleEl);

    var badges = el("div", "badges");
    var t = dueTime(c.due);
    if (!isNaN(t)) {
      var today = dueTime(todayStr());
      var due = el("span", "badge", "📅 " + shortDate(t));
      if (!done && t < today) { due.classList.add("late"); due.title = "Overdue"; }
      else if (!done && t <= today + 2 * DAY) { due.classList.add("soon"); due.title = "Due soon"; }
      badges.appendChild(due);
    }
    if (c.doneAt && settings().showDoneDate) {
      var doneBadge = el("span", "badge full", "✓ " + shortDate(c.doneAt));
      doneBadge.title = "Done " + new Date(c.doneAt).toLocaleString();
      badges.appendChild(doneBadge);
    }
    if (c.checklist.length) {
      var n = c.checklist.filter(function (i) { return i.done; }).length;
      var ck = el("span", "badge");
      ck.innerHTML = CHECK_ICON;
      ck.appendChild(document.createTextNode(n + "/" + c.checklist.length));
      ck.title = n === c.checklist.length ? "Checklist complete" : n + " of " + c.checklist.length + " done";
      if (n === c.checklist.length) ck.classList.add("full");
      badges.appendChild(ck);
    }
    if (c.comments.length) {
      var cm = el("span", "badge", "💬 " + c.comments.length);
      if (hasUnread(c)) {
        cm.appendChild(el("span", "dot"));
        cm.title = "New comment from the agent";
      }
      badges.appendChild(cm);
    }
    if (c.images.length > 1) badges.appendChild(el("span", "badge", "🖼 " + c.images.length));
    var blockers = openBlockers(c);
    if (blockers.length) {
      var nums = blockers.map(function (b) { return "#" + b.num; });
      // The first three blockers on the card; the tooltip lists them all.
      var shown = nums.slice(0, 3).join(", ") + (nums.length > 3 ? " +" + (nums.length - 3) : "");
      var bl = el("span", "badge blocked", "⛔ blocked by " + shown);
      bl.title = "Blocked by " + nums.join(", ");
      badges.appendChild(bl);
    }
    if (str(c.assignee).trim()) {
      var av = el("span", "avatar" + (isAgent(c.assignee) ? " agent" : ""), isAgent(c.assignee) ? "🤖" : initials(c.assignee));
      av.title = c.assignee;
      badges.appendChild(av);
    }
    if (badges.childNodes.length) li.appendChild(badges);

    if (AGENT_MODE && c.status && str(c.status.text || c.status.kind).trim()) {
      var kind = c.status.kind === "blocked" ? "blocked" : c.status.kind === "working" ? "working" : "info";
      var st = el("div", "status " + kind);
      if (kind === "working") st.appendChild(el("span", "pulse"));
      st.appendChild(document.createTextNode((kind === "blocked" ? "Blocked: " : "") + str(c.status.text || (kind === "working" ? "Working…" : ""))));
      li.appendChild(st);
    }
    if (AGENT_MODE && col && col.role === "review") {
      var row = el("div", "review-row");
      var ok = el("button", "approve", "Approve");
      ok.type = "button";
      ok.addEventListener("click", function (e) { e.stopPropagation(); approve(c.id); });
      var back = el("button", "changes", "Changes");
      back.type = "button";
      back.title = "Request changes";
      back.addEventListener("click", function (e) { e.stopPropagation(); openCard(c.id); commentBox.focus(); setHint("Write what should change, then press Request changes."); });
      row.appendChild(ok);
      row.appendChild(back);
      li.appendChild(row);
    }
    li.addEventListener("pointerdown", function (e) { startCardDrag(e, c.id, li); });
    li.addEventListener("contextmenu", function (e) {
      if (isInteractive(e.target) || e.target.closest("a")) return;
      e.preventDefault();
      openCardMenu(c.id, e.clientX, e.clientY);
    });
    return li;
  }

  function openBlockers(c) {
    return c.blockedBy.map(card).filter(function (b) { return b && !b.archived && !isDone(b); });
  }
  function hasUnread(c) {
    var seen = Number(c.seenAt) || 0;
    return c.comments.some(function (cm) { return cm.by === "agent" && cm.at > seen; });
  }

  // ---------- adding cards ----------
  function renderComposer(col) {
    var wrap = el("div", "composer");
    var ta = el("textarea", "composer-input");
    ta.placeholder = "Card title. Enter adds, Ctrl+Enter opens, Shift+Enter for a new line.";
    ta.value = composerText;
    ta.addEventListener("input", function () { composerText = ta.value; });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        addCard(col.id, ta.value, true);
      } else if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        addCard(col.id, ta.value);
      } else if (e.key === "Escape") {
        composerCol = null;
        render();
      }
    });
    var row = el("div", "row");
    var add = el("button", "primary", "Add");
    add.type = "button";
    add.addEventListener("click", function () { addCard(col.id, ta.value); });
    var cancel = el("button", "ghost", "Cancel");
    cancel.type = "button";
    cancel.addEventListener("click", function () { composerCol = null; render(); });
    row.appendChild(add);
    row.appendChild(cancel);
    wrap.appendChild(ta);
    wrap.appendChild(row);
    return wrap;
  }

  function addCard(colId, text, open) {
    var title = str(text).trim();
    if (!title) return null;
    var now = Date.now();
    var num = Math.max(1, Math.floor(Number(scribe.state.nextNum) || 1));
    var c = {
      id: newId("c"), num: num, col: colId, title: title, description: "", labels: [], priority: 0,
      checklist: [], comments: [], images: [], blockedBy: [], createdAt: now, movedAt: now
    };
    var col = column(colId);
    if (col && col.role === "done") c.doneAt = now;
    composerText = "";
    if (open) {
      composerCol = null;
      focusComposerNext = false;
    } else {
      focusComposerNext = true;
    }
    scribe.set({ cards: allCards().concat([c]), nextNum: num + 1 });
    render();
    afterMove(c.id, null, colId);
    var list = boardEl.querySelector('.cards[data-col="' + colId + '"]');
    if (list) list.scrollTop = list.scrollHeight;
    if (open) {
      openCard(c.id);
      startEditDesc();
    }
    return c.id;
  }

  // ---------- column menu ----------
  function closeMenu() {
    if (menuEl) {
      menuEl.remove();
      menuEl = null;
    }
    var pill = document.querySelector(".label-add.open");
    if (pill) pill.classList.remove("open");
  }
  function openMenu(anchor, build, alignLeft) {
    closeMenu();
    menuEl = el("div", "menu");
    build(menuEl);
    document.body.appendChild(menuEl);
    var r = anchor.getBoundingClientRect();
    var w = menuEl.offsetWidth, h = menuEl.offsetHeight;
    menuEl.style.left = clamp(alignLeft ? r.left : r.right - w, 8, window.innerWidth - w - 8) + "px";
    menuEl.style.top = (r.bottom + h + 6 > window.innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
  }
  function menuButton(menu, text, fn, disabled) {
    var b = el("button", null, text);
    b.type = "button";
    b.disabled = Boolean(disabled);
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      closeMenu();
      fn();
    });
    menu.appendChild(b);
    return b;
  }
  function openColumnMenu(col, anchor) {
    openMenu(anchor, function (menu) {
      var cols = columns();
      var idx = cols.findIndex(function (c) { return c.id === col.id; });
      var count = cardsIn(col.id).length;
      menuButton(menu, "Rename", function () { editingCol = col.id; render(); });
      menuButton(menu, "Move left", function () { moveColumn(col.id, idx - 1); }, idx <= 0);
      menuButton(menu, "Move right", function () { moveColumn(col.id, idx + 1); }, idx >= cols.length - 1);
      if (AGENT_MODE && col.role === "agent") menuButton(menu, worker(col.id) ? "Agent worker…" : "Set up an agent worker…", function () { openWorker(col.id); });

      menu.appendChild(el("div", "sep"));
      menu.appendChild(el("div", "label", "Card limit"));
      var row = el("div", "menu-row");
      var wip = el("input", "field");
      wip.type = "number";
      wip.min = "0";
      wip.max = "99";
      wip.placeholder = "none";
      wip.value = col.wip ? String(col.wip) : "";
      wip.addEventListener("click", function (e) { e.stopPropagation(); });
      wip.addEventListener("keydown", function (e) { if (e.key === "Enter") { commitWip(); closeMenu(); } });
      wip.addEventListener("change", commitWip);
      function commitWip() {
        var n = Math.floor(Number(wip.value) || 0);
        setColumns(columns().map(function (c) {
          if (c.id !== col.id) return c;
          var next = Object.assign({}, c);
          if (n > 0) next.wip = clamp(n, 1, 99); else delete next.wip;
          return next;
        }));
      }
      row.appendChild(wip);
      row.appendChild(el("span", "note", "warns, never blocks"));
      menu.appendChild(row);

      menu.appendChild(el("div", "sep"));
      menu.appendChild(el("div", "label", "Role"));
      ROLES.forEach(function (r) {
        if (!AGENT_MODE && r[0] !== "" && r[0] !== "done") return;
        var b = menuButton(menu, "", function () { setRole(col.id, r[0]); });
        var mark = el("span", "check-mark", (col.role || "") === r[0] ? "✓" : "");
        b.appendChild(mark);
        b.appendChild(document.createTextNode(r[1]));
      });

      menu.appendChild(el("div", "sep"));
      menuButton(menu, "Archive all cards here", function () { archiveColumn(col.id); }, !count);
      menuButton(menu, count ? "Delete column (move or archive its cards first)" : "Delete column", function () {
        setColumns(columns().filter(function (c) { return c.id !== col.id; }));
      }, count > 0 || cols.length <= 1);
    });
  }
  function moveColumn(id, index) {
    var cols = columns().slice();
    var from = cols.findIndex(function (c) { return c.id === id; });
    if (from === -1) return;
    var moved = cols.splice(from, 1)[0];
    cols.splice(clamp(index, 0, cols.length), 0, moved);
    setColumns(cols);
  }
  function setRole(id, role) {
    setColumns(columns().map(function (c) {
      if (c.id !== id) return c;
      var next = Object.assign({}, c);
      if (role) next.role = role; else delete next.role;
      return next;
    }));
  }
  function archiveColumn(colId) {
    var now = Date.now();
    var ids = cardsIn(colId).map(function (c) { return c.id; });
    setCards(allCards().map(function (c) {
      return ids.indexOf(c.id) === -1 ? c : Object.assign({}, c, { archived: true, archivedAt: now });
    }));
    setHint(ids.length + " archived.");
  }

  // ---------- dragging ----------
  // Like the tab strip: the slot moves past a neighbour once the lifted item's center crosses
  // the midpoint between the slot and that neighbour, so there is no need to overshoot.
  var EDGE = 56;
  var SLIDE = "transform 160ms cubic-bezier(0.4, 0, 0.2, 1)";

  function isInteractive(target) {
    return Boolean(target.closest("button, input, textarea, select, a, .col-title"));
  }
  /** Layout box without any in-flight slide transform, so slides don't feed back into hit tests. */
  function layoutBox(node) {
    var r = node.getBoundingClientRect();
    var t = getComputedStyle(node).transform;
    var m = t && t !== "none" ? new DOMMatrix(t) : null;
    var left = r.left - (m ? m.m41 : 0);
    var top = r.top - (m ? m.m42 : 0);
    return { left: left, top: top, right: left + node.offsetWidth, bottom: top + node.offsetHeight };
  }
  /** FLIP: whatever `mutate` moves slides from its old spot instead of jumping. */
  function slide(nodes, mutate) {
    var before = nodes.map(function (n) { return layoutBox(n); });
    mutate();
    nodes.forEach(function (n, i) {
      if (!n.isConnected) return;
      var now = layoutBox(n);
      var dx = before[i].left - now.left;
      var dy = before[i].top - now.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      n.style.transition = "none";
      n.style.transform = "translate(" + dx + "px, " + dy + "px)";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          n.style.transition = SLIDE;
          n.style.transform = "";
        });
      });
    });
  }
  /** Scroll speed for a pointer this close to (or past) an edge; 0 when not near one. */
  function edgeSpeed(pos, low, high) {
    if (pos < low + EDGE) return -Math.ceil(18 * Math.min(1, (low + EDGE - pos) / EDGE));
    if (pos > high - EDGE) return Math.ceil(18 * Math.min(1, (pos - (high - EDGE)) / EDGE));
    return 0;
  }
  function visibleCards(list) {
    return Array.prototype.filter.call(list.children, function (n) {
      return n.classList.contains("card") && !n.classList.contains("src");
    });
  }
  function neighbour(slot, dir) {
    var n = dir > 0 ? slot.nextElementSibling : slot.previousElementSibling;
    while (n && (!n.classList.contains("card") || n.classList.contains("src"))) {
      n = dir > 0 ? n.nextElementSibling : n.previousElementSibling;
    }
    return n;
  }
  function listAt(x) {
    var lists = boardEl.querySelectorAll(".cards");
    var best = null, bestDist = Infinity;
    for (var i = 0; i < lists.length; i++) {
      var r = lists[i].parentNode.getBoundingClientRect();
      var dist = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
      if (dist < bestDist) { bestDist = dist; best = lists[i]; }
    }
    return bestDist < 60 ? best : null;
  }

  function placeCardSlot(slot, list, gy) {
    if (slot.parentNode !== list) {
      var from = slot.parentNode;
      var cards = visibleCards(list);
      var before = null;
      for (var i = 0; i < cards.length; i++) {
        var b = layoutBox(cards[i]);
        if (gy < (b.top + b.bottom) / 2) { before = cards[i]; break; }
      }
      slide(cards.concat(from ? visibleCards(from) : []), function () { list.insertBefore(slot, before); });
      return;
    }
    for (var guard = 0; guard < 60; guard++) {
      var box = layoutBox(slot);
      var next = neighbour(slot, 1);
      var prev = neighbour(slot, -1);
      if (next && gy > (box.top + layoutBox(next).bottom) / 2) {
        slide([next], function () { list.insertBefore(slot, next.nextSibling); });
      } else if (prev && gy < (layoutBox(prev).top + box.bottom) / 2) {
        slide([prev], function () { list.insertBefore(slot, prev); });
      } else {
        break;
      }
    }
  }

  /** Shared pointer plumbing: a 6px threshold, then begin/frame each animation frame until release. */
  function trackDrag(e, handlers) {
    var start = { x: e.clientX, y: e.clientY };
    var last = { x: e.clientX, y: e.clientY };
    var active = false;
    var raf = 0;
    function frame() {
      raf = 0;
      if (!active) return;
      handlers.frame(last.x, last.y);
      raf = requestAnimationFrame(frame);
    }
    function move(ev) {
      last = { x: ev.clientX, y: ev.clientY };
      if (!active) {
        if (Math.abs(ev.clientX - start.x) + Math.abs(ev.clientY - start.y) < 6) return;
        active = true;
        closeMenu();
        document.body.classList.add("dragging");
        handlers.begin(start);
        if (!raf) raf = requestAnimationFrame(frame);
      }
      ev.preventDefault();
    }
    function stop(ev, cancelled) {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", cancel);
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      if (!active) {
        if (!cancelled && handlers.click) handlers.click();
        return;
      }
      document.body.classList.remove("dragging");
      // A quick flick can end before the next frame placed the slot.
      if (!cancelled) handlers.frame(last.x, last.y);
      handlers.end(cancelled);
    }
    function up(ev) { stop(ev, false); }
    function cancel(ev) { stop(ev, true); }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", cancel);
  }

  function startCardDrag(e, id, cardEl) {
    if (e.button !== 0 || isInteractive(e.target)) return;
    var ghost, slot, offX, offY;
    trackDrag(e, {
      click: function () { openCard(id); },
      begin: function (start) {
        var rect = cardEl.getBoundingClientRect();
        offX = start.x - rect.left;
        offY = start.y - rect.top;
        ghost = cardEl.cloneNode(true);
        ghost.classList.add("ghost-card");
        ghost.style.width = rect.width + "px";
        ghost.style.left = rect.left + "px";
        ghost.style.top = rect.top + "px";
        document.body.appendChild(ghost);
        slot = el("li", "card-slot");
        slot.style.height = rect.height + "px";
        cardEl.parentNode.insertBefore(slot, cardEl);
        cardEl.classList.add("src");
        cardEl.style.display = "none";
        drag = { kind: "card" };
      },
      frame: function (x, y) {
        ghost.style.left = x - offX + "px";
        ghost.style.top = y - offY + "px";
        var b = boardEl.getBoundingClientRect();
        boardEl.scrollLeft += edgeSpeed(x, b.left, b.right);
        var g = ghost.getBoundingClientRect();
        var list = listAt(g.left + g.width / 2);
        if (!list) return;
        var lr = list.getBoundingClientRect();
        list.scrollTop += edgeSpeed(y, lr.top, lr.bottom);
        placeCardSlot(slot, list, g.top + g.height / 2);
      },
      end: function (cancelled) {
        var list = slot.parentNode;
        var nextEl = neighbour(slot, 1);
        ghost.remove();
        slot.remove();
        drag = null;
        if (!cancelled && list && list.dataset.col) dropCard(id, list.dataset.col, nextEl ? nextEl.dataset.id : null);
        else render();
      }
    });
  }

  function dropCard(id, colId, beforeId) {
    var cards = allCards().slice();
    var from = cards.findIndex(function (c) { return c.id === id; });
    if (from === -1) return render();
    var moving = Object.assign({}, cards[from]);
    var fromCol = moving.col;
    cards.splice(from, 1);
    var top = completes(moving, colId);
    enterColumn(moving, colId, Date.now());
    setCards(insertCard(cards, moving, colId, beforeId, top));
    afterMove(id, fromCol, colId);
  }

  function startColumnDrag(e, colId, colEl) {
    if (e.button !== 0 || isInteractive(e.target) || editingCol) return;
    var ghost, slot, offX, offY;
    function sibling(dir) {
      var n = dir > 0 ? slot.nextElementSibling : slot.previousElementSibling;
      while (n && n === colEl) n = dir > 0 ? n.nextElementSibling : n.previousElementSibling;
      return n && n.classList.contains("column") ? n : null;
    }
    trackDrag(e, {
      begin: function (start) {
        var rect = colEl.getBoundingClientRect();
        offX = start.x - rect.left;
        offY = start.y - rect.top;
        ghost = colEl.cloneNode(true);
        ghost.classList.add("ghost-col");
        ghost.style.width = rect.width + "px";
        ghost.style.height = Math.min(rect.height, 360) + "px";
        ghost.style.overflow = "hidden";
        ghost.style.left = rect.left + "px";
        ghost.style.top = rect.top + "px";
        document.body.appendChild(ghost);
        slot = el("div", "col-slot");
        colEl.parentNode.insertBefore(slot, colEl);
        colEl.style.display = "none";
        drag = { kind: "column" };
      },
      frame: function (x, y) {
        ghost.style.left = x - offX + "px";
        ghost.style.top = y - offY + "px";
        var b = boardEl.getBoundingClientRect();
        boardEl.scrollLeft += edgeSpeed(x, b.left, b.right);
        var g = ghost.getBoundingClientRect();
        var gx = g.left + g.width / 2;
        for (var guard = 0; guard < 30; guard++) {
          var box = layoutBox(slot);
          var next = sibling(1);
          var prev = sibling(-1);
          if (next && gx > (box.left + layoutBox(next).right) / 2) {
            slide([next], function () { boardEl.insertBefore(slot, next.nextSibling); });
          } else if (prev && gx < (layoutBox(prev).left + box.right) / 2) {
            slide([prev], function () { boardEl.insertBefore(slot, prev); });
          } else {
            break;
          }
        }
      },
      end: function (cancelled) {
        var order = [];
        Array.prototype.forEach.call(boardEl.children, function (n) {
          if (n === slot) order.push(colId);
          else if (n.classList.contains("column") && n !== colEl) order.push(n.dataset.col);
        });
        ghost.remove();
        slot.remove();
        drag = null;
        if (cancelled) return render();
        var byId = {};
        columns().forEach(function (c) { byId[c.id] = c; });
        setColumns(order.map(function (id) { return byId[id]; }).filter(Boolean));
      }
    });
  }

  var editingCheck = null;

    });
  }
  // One listener on the list, since the first click re-renders the row the second click lands on.
  // The first click ticks at once; a second click of a double-click undoes that tick and edits.
  checklistEl.addEventListener("click", function (e) {
    var span = e.target.closest && e.target.closest("li > span");
    if (!span || editingCheck || !openId) return;
    var id = span.parentNode.dataset.id;
    var cardId = openId;
    if (e.detail >= 2) {
      var undo = lastCheckToggle && lastCheckToggle.id === id && Date.now() - lastCheckToggle.at < 700;
      lastCheckToggle = null;
      if (e.detail > 2) return;
      if (undo) toggleCheck(cardId, id);
      var c = card(cardId);
      var item = c && c.checklist.find(function (i) { return i.id === id; });
      var row = checklistEl.querySelector('li[data-id="' + id + '"] > span');
      if (item && row) editCheckItem(cardId, item, row);
      return;
    }
    toggleCheck(cardId, id);
    lastCheckToggle = { id: id, at: Date.now() };
  });
  /** Swap an item's text for an input: Enter or click-away saves, Esc cancels, empty removes the item. */
  function editCheckItem(cardId, item, span) {
    editingCheck = item.id;
    var input = el("input", "field ck-edit");
    input.value = item.text;
    span.replaceWith(input);
    input.focus();
    input.select();
    var done = false;
    function finish(save) {
      if (done) return;
      done = true;
      editingCheck = null;
      var textValue = input.value.trim();
      if (!save || textValue === item.text) return renderModal();
      updateCard(cardId, function (x) {
        x.checklist = textValue
          ? x.checklist.map(function (i) { return i.id === item.id ? Object.assign({}, i, { text: textValue }) : i; })
          : x.checklist.filter(function (i) { return i.id !== item.id; });
        return x;
      });
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
    input.addEventListener("blur", function () { finish(true); });
  }

  // ---------- assignee combobox ----------

  /** Filterable list of the board's labels the card doesn't have; typing a new name offers to create it. */
  function openLabelPicker(cardId, anchor, query) {
    var active = 0;
    var rows = [];
    openMenu(anchor, function (menu) {
      menu.style.width = "230px";
      var input = el("input", "field menu-search");
      input.placeholder = "Filter or create a label";
      input.value = query;

      var listEl = el("div");
      menu.appendChild(input);
      menu.appendChild(listEl);
      function build() {
        var c = card(cardId);
        if (!c) return closeMenu();
        var q = input.value.trim().toLowerCase();
        var all = labels();
        rows = all.filter(function (l) {
          return c.labels.indexOf(l.id) === -1 && (!q || l.name.toLowerCase().indexOf(q) !== -1);
        }).map(function (l) { return { label: l }; });
        if (q && !all.some(function (l) { return l.name.toLowerCase() === q; })) rows.push({ create: input.value.trim() });
        active = clamp(active, 0, Math.max(0, rows.length - 1));
        listEl.replaceChildren();
        if (!rows.length) listEl.appendChild(el("div", "empty-row", all.length ? "All labels are on this card." : "Type a name to create a label."));
        rows.forEach(function (row, i) {

            b.appendChild(el("span", "sw"));
            b.lastChild.style.background = PALETTE[all.length % PALETTE.length];
            b.appendChild(document.createTextNode("Create \u201c" + row.create + "\u201d"));
          }
          b.classList.toggle("active", i === active);
          b.addEventListener("mouseenter", function () { active = i; highlight(); });
          b.addEventListener("click", function (ev) { ev.stopPropagation(); pick(i); });
          listEl.appendChild(b);
        });
      }
      function highlight() {
        Array.prototype.forEach.call(listEl.children, function (b, i) { b.classList.toggle("active", i === active); });
      }
      function pick(i) {
        var row = rows[i];

          ev.stopPropagation();

  function addImageFiles(files, intoDescription) {

    var targetId = c.id;

      if (!/^image\/(png|jpe?g|gif|webp)$/i.test(file.type)) {

        return;
      }
      setHint("Adding image…");
      shrinkImage(file, function (err, blob) {
        if (err || !blob) return setHint("Could not read that image.", true);
        scribe.saveAsset(blob, { name: file.name || "image" }).then(function (asset) {
          var im = { id: newId("im"), name: asset.name, data: asset.url };
          var embed = intoDescription && editingDesc && openId === targetId;
          if (embed) insertAtCursor(mdEditor, "![" + im.name + "](#img-" + im.id + ")\n");
          updateCard(targetId, function (x) {
            x.images = x.images.concat([im]);

            return x;
          });
          setHint(asset.usage && asset.usage.warning ? "Image added. Storage is filling up: " + asset.usage.warning + "." : "Image added.", Boolean(asset.usage && asset.usage.warning));
        }, function (e) {
          setHint("Could not save that image: " + e.message, true);
        });
      });
    });

  function insertAtCursor(ta, text) {
    var s = ta.selectionStart || 0, e = ta.selectionEnd || 0;

  /** Small files stay as they are (animated gifs keep animating); large ones are scaled to a JPEG. */
  function shrinkImage(file, cb) {
    if (file.size <= 1536 * 1024) return cb(null, file);
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      var scale = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight, 1));
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#1a1d24";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) { cb(blob ? null : new Error("encode"), blob); }, "image/jpeg", 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(new Error("decode")); };
    img.src = url;
  }

  // ---------- confirmation ----------
  var confirmBack = $("confirmBack");
  var confirmDone = null;
  /** In-page replacement for window.confirm. Resolves true on confirm; Esc, Cancel or the backdrop resolve false. */
  function askConfirm(opts) {
    if (confirmDone) confirmDone(false);
    closeMenu();
    $("confirmTitle").textContent = opts.title;

    $("confirmOk").textContent = opts.ok || "Delete";
    var returnFocus = document.activeElement;
    confirmBack.classList.remove("hidden");
    $("confirmOk").focus();
    return new Promise(function (resolve) {
      confirmDone = function (ok) {
        confirmDone = null;
        confirmBack.classList.add("hidden");
        if (returnFocus && returnFocus.isConnected && returnFocus.focus) returnFocus.focus();
        resolve(ok);
      };
    });
  }
  $("confirmOk").addEventListener("click", function () { if (confirmDone) confirmDone(true); });
  $("confirmCancel").addEventListener("click", function () { if (confirmDone) confirmDone(false); });
  confirmBack.addEventListener("pointerdown", function (e) {
    if (e.target === confirmBack && confirmDone) confirmDone(false);
  });

  window.addEventListener("keydown", function (e) {
    if (!confirmDone) return;

      e.preventDefault();
