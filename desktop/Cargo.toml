[package]
name = "agent-board-desktop"
version = "1.0.0"
description = "Desktop window for Agent Board"
edition = "2021"
rust-version = "1.90"
default-run = "board"
autobins = false

[[bin]]
name = "board"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
